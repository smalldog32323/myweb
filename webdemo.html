<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>正在打开应用…</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
background:#0f1720;color:#e8eef5;min-height:100vh;display:flex;align-items:center;
justify-content:center;padding:24px;-webkit-font-smoothing:antialiased}
.wrap{max-width:420px;width:100%;text-align:center}
.spin{width:56px;height:56px;margin:0 auto 28px;border:3px solid rgba(255,255,255,.12);
border-top-color:#4da3ff;border-radius:50%;animation:s .8s linear infinite}
@keyframes s{to{transform:rotate(360deg)}}
h1{font-size:20px;font-weight:600;margin-bottom:10px;letter-spacing:.3px}
p{font-size:14px;line-height:1.7;color:#8b9bb0}
.hidden{display:none}
.btn{display:block;width:100%;padding:15px;margin-top:14px;border:none;border-radius:14px;
background:#4da3ff;color:#fff;font-size:16px;font-weight:600;text-decoration:none;
cursor:pointer;font-family:inherit;transition:transform .15s}
.btn:active{transform:scale(.97)}
.btn.ghost{background:transparent;border:1px solid rgba(255,255,255,.18);color:#c3d0de}
.card{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.09);
border-radius:20px;padding:32px 24px}
.tip{margin-top:20px;font-size:12px;line-height:1.8;color:#6b7a8c}
.warn{margin-top:18px;padding:12px 14px;background:rgba(255,180,80,.1);
border-radius:12px;font-size:12px;color:#ffc46b;line-height:1.7;text-align:left}
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <div id="loading">
      <div class="spin"></div>
      <h1>正在打开应用…</h1>
      <p>如果没反应，说明你还没安装</p>
    </div>
    <div id="fallback" class="hidden">
      <h1>没检测到应用</h1>
      <p>请先安装后，再回到这个页面点下面的按钮</p>
      <a id="dl" class="btn" href="#">下载安装</a>
      <button class="btn ghost" onclick="openApp()">已安装？点此手动打开</button>
      <div class="warn">打不开？如果你是在微信里点的，请点右上角「···」→「在浏览器打开」</div>
      <button class="btn ghost" onclick="copyLink()">复制链接</button>
      <div class="tip">本页不会保存任何信息，链接只在你和对方手中</div>
    </div>
  </div>
</div>

<script>
// ★★★ 这里填你的下载页地址（APK 下载链接），暂时没有就先留空 ★★★
var APK_URL = "";

var payload = location.hash ? location.hash.substring(1) : "";

function openApp(){
  if(!payload){ showFallback(); return; }
  // 优先走 App Links（已安装且验证通过时无缝唤起）
  // 再走自定义 scheme 兜底
  var before = Date.now();
  var iframe = document.createElement("iframe");
  iframe.style.display = "none";
  iframe.src = "mynet://join#" + payload;
  document.body.appendChild(iframe);

  setTimeout(function(){
    document.body.removeChild(iframe);
    // 2 秒内页面仍可见 = 没唤起成功
    if(Date.now() - before < 2200 && !document.hidden){
      showFallback();
    }
  }, 1800);
}

function showFallback(){
  document.getElementById("loading").className = "hidden";
  document.getElementById("fallback").className = "";
  var dl = document.getElementById("dl");
  if(APK_URL){ dl.href = APK_URL; }
  else { dl.className = "btn hidden"; }
}

function copyLink(){
  var t = document.createElement("textarea");
  t.value = location.href; document.body.appendChild(t);
  t.select(); document.execCommand("copy"); document.body.removeChild(t);
  alert("链接已复制，发给对方用浏览器打开");
}

// 页面从后台切回前台 = 说明唤起成功了，不用管
document.addEventListener("visibilitychange", function(){
  if(document.hidden){
    document.getElementById("loading").className = "hidden";
  }
});

window.onload = function(){ setTimeout(openApp, 300); };
</script>
</body>
</html>
