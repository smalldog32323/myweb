<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>火柴人超燃对决</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;background:#ddd0b6;font-family:"KaiTi","STKaiti","楷体","Songti SC","STSong","SimSun",serif;color:#23201c;user-select:none}
#app{position:fixed;inset:0;overflow:hidden}
canvas{display:block;touch-action:none}
#cv{position:absolute;inset:0}

/* ---------- 纸墨风格基底 ---------- */
.paper{background:#efe4cb;background-image:radial-gradient(circle at 20% 15%,rgba(255,255,255,.55),transparent 45%),radial-gradient(circle at 82% 78%,rgba(180,160,120,.28),transparent 50%)}
.ink{color:#23201c}
.seal{color:#a8322d}

/* ---------- 通用面板 ---------- */
.panel{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;padding:12px;overflow:hidden;overflow-y:auto;-webkit-overflow-scrolling:touch}
.card{background:rgba(243,235,216,.96);border:2px solid #23201c;border-radius:6px;padding:14px 16px;box-shadow:5px 6px 0 rgba(35,32,28,.16);max-width:560px;width:100%;max-height:calc(100dvh - 24px);margin:auto;display:flex;flex-direction:column}
.card>.scrollArea{flex:1 1 auto;min-height:0;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;touch-action:pan-y;margin:0 -4px;padding:0 4px}
.card>.fixedFoot{flex:0 0 auto;padding-top:10px}
.card.thin{max-width:380px}
h1.logo{font-size:38px;letter-spacing:6px;line-height:1.1;text-align:center;font-weight:bold}
h1.logo small{display:block;font-size:13px;letter-spacing:10px;color:#7a6a52;margin-top:6px}
h2.tt{font-size:20px;letter-spacing:3px;border-bottom:2px solid #23201c;padding-bottom:6px;margin-bottom:12px;display:flex;justify-content:space-between;align-items:flex-end}
h2.tt em{font-style:normal;font-size:12px;color:#7a6a52;letter-spacing:1px}
h3.sub{font-size:15px;letter-spacing:2px;margin:12px 0 8px;color:#5a4c38;border-left:4px solid #a8322d;padding-left:8px}

button,.btn{font-family:inherit;font-size:16px;letter-spacing:2px;color:#f3ebd8;background:#23201c;border:none;border-radius:4px;padding:11px 18px;cursor:pointer;position:relative;box-shadow:3px 3px 0 rgba(35,32,28,.25);transition:transform .08s}
button:active,.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 rgba(35,32,28,.25)}
button.red{background:#a8322d}
button.ghost{background:transparent;color:#23201c;border:2px solid #23201c;box-shadow:3px 3px 0 rgba(35,32,28,.14)}
button.sm{font-size:13px;padding:7px 12px;letter-spacing:1px}
button:disabled{opacity:.4}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.stack{display:flex;flex-direction:column;gap:10px}

/* ---------- 武器格 ---------- */
.wgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px;padding:4px;touch-action:pan-y}
.wcard{border:2px solid #23201c;border-radius:4px;padding:6px;text-align:center;background:#f7f0dd;cursor:pointer;position:relative}
.wcard.sel{background:#23201c;color:#f3ebd8;box-shadow:3px 3px 0 rgba(168,50,45,.5)}
.wcard .wn{font-size:13px;letter-spacing:1px;line-height:1.2}
.wcard .wc{font-size:10px;color:#8a7a60;margin-top:2px}
.wcard.sel .wc{color:#c9bca2}
.wcard canvas{width:100%;height:38px;display:block}

/* ---------- 皮肤工坊 ---------- */
.skinWrap{display:flex;flex-direction:column;gap:10px;align-items:center}
@media (min-width:720px){.skinWrap{flex-direction:row;align-items:flex-start}}
.skinWrap .fld{width:100%;min-width:0}
@media (min-width:720px){.skinWrap .fld{width:auto;min-width:280px}}
.skinPrev{border:2px solid #23201c;border-radius:4px;background:#f7f0dd;flex:0 0 auto}
.optrow{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.chip{font-size:12px;padding:6px 10px;border:2px solid #23201c;border-radius:20px;cursor:pointer;background:#f7f0dd;color:#23201c;letter-spacing:1px;touch-action:manipulation;-webkit-tap-highlight-color:transparent;min-height:30px}
.chip.on{background:#a8322d;color:#f3ebd8;border-color:#23201c}
.chip:active{transform:scale(.94);background:#a8322d;color:#f3ebd8}
button.chip,button.sw{font-family:inherit;line-height:1.1}
button.sw{padding:0;touch-action:manipulation;-webkit-tap-highlight-color:transparent;border-radius:50%}
.sw:active{transform:scale(.85)}
.sgrp>h4{color:#23201c}
.sgrp>h4 .ar{color:#5a4c38}
.sgrp .mini,.sgrp .sl b{color:#23201c}
.sgrp .sl input[type=range]{accent-color:#a8322d}
.sgrp{border:2px solid rgba(35,32,28,.25);border-radius:8px;margin-bottom:7px;overflow:hidden;background:rgba(247,240,221,.5)}
.sgrp>h4{margin:0;font-size:13px;font-weight:600;padding:9px 11px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;touch-action:manipulation;-webkit-tap-highlight-color:transparent;letter-spacing:1px}
.sgrp>h4:active{background:rgba(168,50,45,.14)}
.sgrp>h4 .ar{font-size:10px;color:#5a4c38;transition:transform .15s}
.sgrp.open>h4 .ar{transform:rotate(90deg)}
.sgrp>div{padding:2px 10px 10px;display:none}
.sgrp.open>div{display:block}
.sgrp .mini{display:none}
.chip.on{background:#a8322d;color:#f3ebd8;border-color:#a8322d}
.sl{display:flex;align-items:center;gap:8px;margin:7px 0;font-size:13px;color:#23201c}
.sl input[type=range]{flex:1;accent-color:#a8322d}
.sl b{font-weight:normal;min-width:38px;text-align:right;color:#7a6a52;font-size:12px}
.fld{flex:1 1 300px;min-width:260px}
.swatches{display:flex;gap:6px;flex-wrap:wrap}
.sw{width:26px;height:26px;border-radius:50%;border:2px solid #23201c;cursor:pointer}
.sw.on{outline:3px solid #a8322d;outline-offset:2px}

/* ---------- HUD ---------- */
#hud{position:absolute;inset:0;pointer-events:none;display:none}
.hpbar{position:absolute;top:calc(10px + env(safe-area-inset-top));width:38%;height:16px;border:2px solid #23201c;background:#e6dbc2;border-radius:3px;overflow:hidden}
.hpbar .fill{height:100%;background:#a8322d;width:100%;transition:width .12s linear}
.hpbar .ghostfill{position:absolute;inset:0;background:#e0b4a8;width:100%;transition:width .5s ease-out .15s;z-index:-1}
#hpP{left:3%}#hpE{right:3%}
.hpname{position:absolute;font-size:12px;letter-spacing:2px;top:calc(28px + env(safe-area-inset-top));color:#3b342b}
#hpPn{left:3%}#hpEn{right:3%;text-align:right}
.hpbar{position:absolute;position:absolute}
.hpInfo{position:absolute;top:calc(10px + env(safe-area-inset-top));width:38%}
.weapTag{position:absolute;font-size:11px;letter-spacing:1px;color:#5a4c38}
.killfeed{position:absolute;top:calc(52px + env(safe-area-inset-top));left:0;right:0;text-align:center;font-size:14px;letter-spacing:2px;color:#a8322d;text-shadow:0 1px 0 #efe4cb}
.timer{position:absolute;top:calc(8px + env(safe-area-inset-top));left:0;right:0;text-align:center;font-size:22px;letter-spacing:3px;color:#23201c}
#joy,#joy2{position:absolute;bottom:calc(24px + env(safe-area-inset-bottom));width:132px;height:132px;border-radius:50%;border:2px solid rgba(35,32,28,.55);background:rgba(243,235,216,.28);pointer-events:auto;touch-action:none}
#joy .knob,#joy2 .knob{position:absolute;left:50%;top:50%;width:54px;height:54px;margin:-27px 0 0 -27px;border-radius:50%;background:rgba(35,32,28,.72);border:2px solid #efe4cb}
#dashBtn{position:absolute;right:18px;bottom:calc(30px + env(safe-area-inset-bottom));width:88px;height:88px;border-radius:50%;border:2px solid rgba(35,32,28,.55);background:rgba(243,235,216,.28);pointer-events:auto;display:flex;align-items:center;justify-content:center;font-size:15px;letter-spacing:2px;color:#3b342b}
#dashBtn.cool{opacity:.35}
#joy2{right:18px}
#dashBtn2{position:absolute;bottom:calc(30px + env(safe-area-inset-bottom));width:88px;height:88px;border-radius:50%;border:2px solid rgba(35,32,28,.55);background:rgba(243,235,216,.28);pointer-events:auto;display:flex;align-items:center;justify-content:center;font-size:15px;letter-spacing:2px;color:#3b342b}
#dashBtn2.cool{opacity:.35}
#splitLine{position:absolute;background:#23201c;opacity:.35}
#viewTag{position:absolute;left:8px;bottom:6px;font-size:10px;color:#5a4c38}
#pauseBox{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(35,32,28,.4);padding:14px;z-index:20;pointer-events:auto}
#pauseBox .card{max-height:80dvh}
#hpWrapP2{display:none}
#hpWrapP2.duo{display:block}
#topRight{position:absolute;right:12px;top:calc(8px + env(safe-area-inset-top));display:flex;gap:6px;pointer-events:auto}
#topRight button{padding:6px 10px;font-size:12px;letter-spacing:1px}
#warn{position:absolute;left:0;right:0;top:34%;text-align:center;font-size:30px;letter-spacing:8px;color:#a8322d;opacity:0;text-shadow:0 2px 0 #efe4cb}

/* ---------- 结算 ---------- */
.bigres{font-size:44px;letter-spacing:10px;text-align:center}
.stat{display:flex;justify-content:space-between;font-size:14px;padding:5px 2px;border-bottom:1px dashed rgba(35,32,28,.3)}
.hide{display:none!important}
.scroll{overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;touch-action:pan-y}
.tip{font-size:12px;color:#7a6a52;line-height:1.6}
.kbd{border:1px solid #23201c;border-radius:3px;padding:0 5px;font-size:11px}
.mini{font-size:11px;color:#8a7a60;letter-spacing:1px}
#toast{position:absolute;left:50%;bottom:16%;transform:translateX(-50%);background:rgba(35,32,28,.9);color:#f3ebd8;font-size:13px;letter-spacing:2px;padding:8px 14px;border-radius:4px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:99}
</style>
</head>
<body>
<div id="app" class="paper">
  <canvas id="cv"></canvas>

  <!-- 主菜单 -->
  <div id="sMenu" class="panel">
    <div class="card thin">
      <h1 class="logo">火柴人<br>超燃对决<small>SUPER BLAZE DUEL</small></h1>
      <div class="stack" style="margin-top:18px">
        <button id="bStart" class="red">开 始 对 战</button>
        <button id="bSet" class="ghost">设 置</button>
        <button id="bCodex" class="ghost">武 器 图 鉴</button>
      </div>
      <p class="tip" style="margin-top:14px;text-align:center">单摇杆操作 · 物理布娃娃 · 随机地形</p>
    </div>
  </div>

  <!-- 模式选择 -->
  <div id="sMode" class="panel hide">
    <div class="card thin">
      <h2 class="tt">选择模式<em>MODE</em></h2>
      <div class="stack">
        <button id="mSolo" class="red">单 人 对 决</button>
        <button id="mDuo" class="ghost">本 地 双 人 · 同屏 1v1</button>
        <button id="mWar" class="ghost">大 战 场 · 混战</button>
      </div>
      <div class="tip" id="modeTip" style="margin-top:12px"></div>
      <div class="row" style="margin-top:12px"><button id="bBack0" class="ghost">返 回</button></div>
    </div>
  </div>

  <!-- 装备 -->
  <div id="sLoad" class="panel hide">
    <div class="card">
      <h2 class="tt">战前准备<em id="loadWho">选一把顺手的家伙</em></h2>
      <div id="duoTabs" class="row hide" style="gap:6px;margin-bottom:8px">
        <button id="tabP1" class="sm ghost">P1 武器</button><button id="tabP2" class="sm ghost">P2 武器</button>
      </div>
      <div class="scrollArea">
        <div class="row" style="justify-content:flex-start;margin-bottom:8px;gap:6px">
          <button id="bRand" class="sm ghost">随 机</button><button id="bRandAll" class="sm ghost">武器+皮肤</button><button id="bSet2" class="sm ghost">设 置</button>
        </div>
        <div class="mini" id="lbDiff" style="margin-bottom:6px"></div>
        <h3 class="sub">武器（<span id="wCount">0</span>）</h3>
        <div class="wgrid" id="wgrid"></div>
        <div style="margin-top:10px;border:2px dashed #23201c;border-radius:4px;padding:10px;background:transparent">
          <div style="font-size:15px;letter-spacing:2px" id="wName">—</div>
          <div class="tip" id="wDesc">点一把武器看看它的门道</div>
        </div>
      </div>
      <div class="fixedFoot">
        <div class="row"><button id="bBack1" class="ghost">返 回</button><button id="bNext1" class="red">确 定 → 皮肤</button></div>
      </div>
    </div>
  </div>

  <!-- 皮肤 -->
  <div id="sSkin" class="panel hide">
    <div class="card">
      <h2 class="tt">皮肤工坊<em id="skinWho">不影响战斗数值</em></h2>
      <div id="duoTabs2" class="row hide" style="gap:6px;margin-bottom:8px">
        <button id="tabS1" class="sm ghost">P1 皮肤</button><button id="tabS2" class="sm ghost">P2 皮肤</button>
      </div>
      <div class="scrollArea">
        <div class="skinWrap">
          <div class="fld" style="flex:0 0 auto"><canvas id="prevCv" width="190" height="250" class="skinPrev"></canvas>
            <div class="row" style="margin-top:8px;gap:6px"><button id="bRandSkin" class="sm ghost">随机捏</button><button id="bResetSkin" class="sm ghost">还原</button></div>
          </div>
          <div class="fld" id="skinOpts"></div>
        </div>
      </div>
      <div class="fixedFoot">
        <div class="row"><button id="bBack2" class="ghost">返 回</button><button id="bNext2" class="red">开 打 !</button></div>
      </div>
    </div>
  </div>

  <!-- 设置 -->
  <div id="sSet" class="panel hide">
    <div class="card thin">
      <h2 class="tt">设置<em>OPTIONS</em></h2>
      <div class="scrollArea" id="setBody"></div>
      <div class="fixedFoot"><div class="row"><button id="bBack3" class="ghost">返 回</button></div></div>
    </div>
  </div>

  <!-- 图鉴 -->
  <div id="sCodex" class="panel hide">
    <div class="card">
      <h2 class="tt">武器图鉴<em>机制各不相同</em></h2>
      <div class="scrollArea"><div class="wgrid" id="cgrid"></div></div>
      <div class="fixedFoot">
        <div class="tip" id="cInfo" style="margin-bottom:8px">—</div>
        <div class="row"><button id="bBack4" class="ghost">返 回</button></div>
      </div>
    </div>
  </div>

  <!-- 战斗 HUD -->
  <div id="hud">
    <div class="timer" id="timer">60</div>
    <div class="hpInfo" id="hpWrapP" style="left:3%">
      <div class="hpbar" style="position:relative"><div class="ghostfill" id="hpPg"></div><div class="fill" id="hpPf"></div></div>
      <div class="hpname" id="hpPn">你</div>
    </div>
    <div class="hpInfo" id="hpWrapE" style="right:3%">
      <div class="hpbar" style="position:relative"><div class="ghostfill" id="hpEg"></div><div class="fill" id="hpEf" style="background:#3f6b5a"></div></div>
      <div class="hpname" id="hpEn" style="right:3%">敌</div>
    </div>
    <div class="hpInfo" id="hpWrapP2" style="right:3%;top:calc(52px + env(safe-area-inset-top))">
      <div class="hpbar" style="position:relative"><div class="ghostfill" id="hpP2g"></div><div class="fill" id="hpP2f" style="background:#2f4b7c"></div></div>
      <div class="hpname" id="hpP2n" style="right:3%;text-align:right">P2</div>
    </div>
    <div class="killfeed" id="feed"></div>
    <div id="warn"></div>
    <div id="joy"><div class="knob"></div></div>
    <div id="dashBtn">冲刺</div>
    <div id="joy2" class="hide"><div class="knob"></div></div>
    <div id="dashBtn2" class="hide">冲刺</div>
    <div id="topRight"><button id="bPause" class="ghost sm">暂停</button></div>
    <div id="pauseBox" class="hide">
      <div class="card thin" style="max-width:320px">
        <h2 class="tt" style="font-size:20px">暂 停<em>PAUSED</em></h2>
        <div class="stack">
          <button id="bResume" class="red">继 续</button>
          <button id="bEndRound" class="ghost">结 束 对 局</button>
          <button id="bQuitMenu" class="ghost">返 回 主 菜 单</button>
        </div>
      </div>
    </div>
  </div>

  <!-- 结算 -->
  <div id="sResult" class="panel hide">
    <div class="card thin">
      <div class="bigres" id="resTitle">胜</div>
      <div id="resBody" style="margin-top:12px"></div>
      <div class="row" style="margin-top:14px">
        <button id="bAgain" class="red">再 来 一 局</button>
        <button id="bChange" class="ghost">换 把 武 器</button>
        <button id="bHome" class="ghost">回 主 菜 单</button>
      </div>
    </div>
  </div>

  <div id="toast"></div>
</div>
<script>
/* =========================================================
   火柴人超燃对决 — 核心层：数学 / 音频 / 物理世界
   ========================================================= */
'use strict';
var TAU = Math.PI * 2;
function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
function lerp(a, b, t) { return a + (b - a) * t; }
function wrapA(a) { a = (a + Math.PI) % TAU; if (a < 0) a += TAU; return a - Math.PI; }
function rand(a, b) { return a + Math.random() * (b - a); }
function randi(a, b) { return Math.floor(a + Math.random() * (b - a + 1)); }
function pick(a) { return a[Math.floor(Math.random() * a.length)]; }
function sgn(v) { return v < 0 ? -1 : 1; }
function len2(x, y) { return Math.sqrt(x * x + y * y); }
function approach(cur, tgt, rate) { if (cur < tgt) return Math.min(cur + rate, tgt); return Math.max(cur - rate, tgt); }

/* ---------- 确定性伪随机（地图用） ---------- */
function mulberry(seed) {
  return function () {
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    var t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

/* =========================================================
   音频：WebAudio 合成，低频闷响负责"厚"
   ========================================================= */
function fin(v, d) { v = +v; return isFinite(v) ? v : d; }
// 武器质量倍率：改它就改了动量伤害与手感
function wmass(w) {
  var m = (w && w.mass) || 1;
  return m * (typeof G !== 'undefined' && G.cfg ? clamp(G.cfg.massMul, 0.1, 5) : 1);
}
var SFX = {
  ctx: null, master: null, vol: 0.7, ok: false,
  init: function () {
    if (this.ctx) return;
    try { this.ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return; }
    this.master = this.ctx.createGain(); this.master.gain.value = this.vol;
    this.master.connect(this.ctx.destination); this.ok = true;
  },
  setVol: function (v) { this.vol = v; if (this.master) this.master.gain.value = v; },
  noiseBuf: null,
  noise: function () {
    if (!this.noiseBuf) {
      var n = this.ctx.sampleRate * 1.0, b = this.ctx.createBuffer(1, n, this.ctx.sampleRate), d = b.getChannelData(0);
      for (var i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
      this.noiseBuf = b;
    }
    var s = this.ctx.createBufferSource(); s.buffer = this.noiseBuf; s.loop = true; return s;
  },
  // 打击：低频"闷"+ 噪声"材质"
  hit: function (power, kind) {
    if (!this.ok) return; var c = this.ctx, t = c.currentTime;
    var p = clamp(fin(power, 0.5), 0.15, 1.4);
    // 低频体感
    var o = c.createOscillator(), g = c.createGain();
    o.type = 'sine'; o.frequency.setValueAtTime(120 * (0.7 + p * 0.5), t);
    o.frequency.exponentialRampToValueAtTime(38, t + 0.16);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.55 * p, t + 0.008);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.22);
    o.connect(g); g.connect(this.master); o.start(t); o.stop(t + 0.24);
    // 材质高频
    var s = this.noise(), f = c.createBiquadFilter(), g2 = c.createGain();
    f.type = 'bandpass';
    var fr = kind === 'metal' ? 2600 : kind === 'wood' ? 1100 : kind === 'fire' ? 700 : 1800;
    f.frequency.value = fr; f.Q.value = 1.2;
    g2.gain.setValueAtTime(0.0001, t); g2.gain.exponentialRampToValueAtTime(0.28 * p, t + 0.006);
    g2.gain.exponentialRampToValueAtTime(0.0001, t + 0.11);
    s.connect(f); f.connect(g2); g2.connect(this.master); s.start(t); s.stop(t + 0.13);
  },
  swing: function (heavy) {
    if (!this.ok) return; var c = this.ctx, t = c.currentTime;
    var s = this.noise(), f = c.createBiquadFilter(), g = c.createGain();

  if (!gnd) {
    var lowFoot = Math.max(p.footL.y, p.footR.y);
    var below = this.world.groundBelowAt(p.pelvis.x, lowFoot - 4);
    if (below - lowFoot < 14 && below - lowFoot > -40 && Math.abs(p.pelvis.vsy()) < 260) {
      gnd = true;
      var snap = (below - 6) - lowFoot;
      p.footL.y += snap; p.footR.y += snap;
    }
  }
  this.grounded = gnd;
  if (gnd) { this.groundedT += dt; this.airT = 0; } else { this.airT += dt; this.groundedT = 0; }
  if (this.isDown()) this.downT += dt; else if (this.downT > 0) this.downT = Math.max(0, this.downT - dt * 2);
  this.updGetUp(dt, game);

  // ---- 各部位重力/阻尼调制 ----
  var gm = 1, dr = 0;
  if (s.heavy > 0) gm *= 2.1;
  if (s.light > 0) gm *= 0.3;
  if (s.weightless > 0) gm *= 0.42;
  if (s.inflate > 0) { gm *= 0.5; dr = 0.09; }
  if (s.freeze > 0) dr = Math.max(dr, 0.14);
  if (s.bubble > 0) { gm *= 0.25; dr = 0.06; }
  if (s.slime > 0) dr = Math.max(dr, 0.10);
  if (s.giant > 0) gm *= 1.35;
  if (s.tiny > 0) gm *= 0.6;
  var all = [p.head, p.neck, p.chest, p.pelvis, p.elbL, p.handL, p.elbR, p.handR, p.kneeL, p.footL, p.kneeR, p.footR, this.wt];
  for (i = 0; i < all.length; i++) { all[i].gmul = gm; all[i].drag = dr; all[i].fricMul = s.oil > 0 ? 0.06 : (s.freeze > 0 ? 0.6 : 1); }
  if (s.burn > 0) {
    this.burnTick -= dt;
    if (this.burnTick <= 0) { this.burnTick = 0.45; this.hurt(2.0, null, 'fire'); FX.flame(this, 5); }
    for (i = 0; i < 3; i++) { var q = all[randi(0, all.length - 1)]; q.ax += rand(-900, 900); q.ay += rand(-900, 900); }
  }
  if (s.electro > 0) { for (i = 0; i < all.length; i++) { all[i].ax += rand(-1400, 1400); all[i].ay += rand(-1400, 1400); } if (Math.random() < 0.3) FX.spark(p.chest.x, p.chest.y, 3, '#ffd76a'); }
  // 泡泡：整个人飘起来，落地前完全控制不了
  if (s.bubble > 0) {
    for (i = 0; i < all.length; i++) all[i].addF(0, -PHYS.gravity * 1.5 * all[i].m);
    if (Math.random() < 0.25) FX.parts.push({ x: this.center().x + rand(-20, 20), y: this.center().y + rand(-20, 20), vx: rand(-20, 20), vy: -rand(20, 60), life: 0.5, max: 0.5, col: '#8fd3e8', sz: 2.5, g: -0.1, t: 'dot' });
  }
  // 幽灵：穿过一切实体
  if (s.ghost > 0) { for (i = 0; i < all.length; i++) all[i].noCollide = 1; }
  else { for (i = 0; i < all.length; i++) all[i].noCollide = 0; }

  // ---- 体型缩放（巨大化 / 缩小）：只改质量与渲染，判定体积不变 ----
  var wantScale = 1;
  if (s.giant > 0) wantScale = 1.62;
  else if (s.tiny > 0) wantScale = 0.6;
  else if (s.shrink > 0) wantScale = 0.62;
  else if (s.grow > 0) wantScale = 1.5;
  if (Math.abs(this.scaleMul - wantScale) > 0.01) {
    var ratio = wantScale / this.scaleMul;
    var mRatio = ratio * ratio;   // 质量按面积
    for (i = 0; i < all.length; i++) { all[i].m *= mRatio; all[i].inv = 1 / all[i].m; }
    this.scaleMul = wantScale;
  }

  // ---- 骨头朝向：膝往前弯、肘往后弯，不许反折 ----
  for (i = 0; i < this.flipMotors.length; i++) this.flipMotors[i][0].flipSign = this.flipMotors[i][1] * this.face;

  // ---- 马达扭矩上限 = 肌肉 ----
  var mm = mf * (s.hard > 0 ? 1.5 : 1);
  // 鬼畜：受击后肌肉临时松开（但骨头限位还在，所以是"面条"不是"散架"）
  if (this.floppyT > 0) {
    this.floppyT -= dt;
    mm *= (1 - clamp(this.floppy, 0, 1.4) * 0.8);
    if (this.floppyT <= 0) { this.floppyT = 0; this.floppy = 0; }
  }
  // 无骨计时：到期后骨头长回来（人重新"有骨"）
  if (this.bonelessT > 0) {
    this.bonelessT -= dt;
    // 持续抽动：无骨期间每个部位都在微微乱抖 —— 这是"鬼畜"最直观的那一下
    if (this.bonelessLv > 0 && Math.random() < 0.55) {
      var amt = (this.bonelessLv >= 2 ? 130 : 70) * clamp(this.bonelessT, 0, 1);
      var qq = all[randi(0, all.length - 1)];
      qq.addVel(rand(-1, 1) * amt, rand(-1, 1) * amt - amt * 0.3);
    }
    if (this.bonelessT <= 0) { this.bonelessT = 0; this.setBoneless(0); }
  }
  // 超鬼畜：连续几次随机弹射
  if (this.kickT > 0) {
    this.kickT -= dt;
    if (this.kickN > 0 && Math.random() < 0.35) {
      this.kickN--;
      var kq = all[randi(0, all.length - 1)];
      kq.addVel(rand(-1, 1) * 700, rand(-1, 0.2) * 700);
      FX.spark(kq.x, kq.y, 3, '#ffd76a');
    }
  }
  if (this.getUpT > 0) mm *= 1 + this.getUpPush * 0.9;   // 爬起来那一下是全力挣扎
  var prec = s.berserk > 0 ? 0.5 : 1;
  this.mSpine.torque = TORQUE.waist * mm;
  this.mNeck.torque = TORQUE.neck * mm;
  this.mShR.torque = TORQUE.shoulder * mm * prec; this.mShL.torque = TORQUE.shoulder * mm * 0.7;
  this.mElR.torque = TORQUE.elbow * mm * prec; this.mElL.torque = TORQUE.elbow * mm * 0.7;
  this.mHipR.torque = TORQUE.hip * mm * prec; this.mHipL.torque = TORQUE.hip * mm * prec;
  this.mKnR.torque = TORQUE.knee * mm * prec; this.mKnL.torque = TORQUE.knee * mm * prec;
  this.mAnkR.torque = TORQUE.ankle * mm; this.mAnkL.torque = TORQUE.ankle * mm;

  // ---- 失衡时姿态目标抖动 ----
  var wob = this.instability * 0.5 + (s.berserk > 0 ? 0.18 : 0);
  this.mSpine.worldTarget = -Math.PI / 2 + Math.sin(game.time * 9 + this.id) * wob * 0.6;

  this.locomote(dt, game, mf, gnd);
  this.updWeapon(dt, game, mf);

  // ---- 地面伤害（尖刺/岩浆由 hazard 处理）----
  this.squashV += (1 - this.squash) * 60 * dt; this.squashV *= 0.86; this.squash += this.squashV * dt;
  this.squash = clamp(this.squash, 0.7, 1.35);
  if (this.trail.length > 14) this.trail.shift();
  this.trail.push({ x: p.chest.x, y: p.chest.y, t: game.time });
};

/* ---------- 冲刺：沿摇杆方向 ---------- */
Fighter.prototype.tryDash = function (vx, vy) {
  if (this.dead || this.dashCd > 0) return false;
  var l = len2(vx, vy);
  if (l < 0.15) { vx = this.face; vy = 0; l = 1; }
  vx /= l; vy /= l;
  this.dashCd = 1.5; this.dashT = 0.26;
  this.dashVx = vx; this.dashVy = vy;
  this.dashDir = vx >= 0 ? 1 : -1;
  if (Math.abs(vx) > 0.3) this.face = vx > 0 ? 1 : -1;
  var c = this.center();
  FX.ring(c.x, c.y, 26, '#23201c');
  for (var i = 0; i < 8; i++) FX.dust(this.p.pelvis.x, this.footY(), -vx);
  SFX.tone(560, 220, 0.16, 'triangle', 0.16);
  return true;
};

/* ---------- 趴地 → 自己爬起来 ----------
   趴多久由"打趴你那一击的威力 + 当前失衡度"决定，不是写死的计时器。
   起身后给一小段无敌，防止被连续击倒滚雪球。 */
Fighter.prototype.updGetUp = function (dt, game) {
  var down = this.isDown();
  if (down && !this.wasDown) {
    // 刚被打趴：按威力算要趴多久
    this.downDelay = clamp(0.30 + this.lastHitDmg / 26 + this.instability * 0.75, 0.35, 2.6);
    this.downT = 0; this.getUpT = 0;
    this.getUpDur = clamp(0.42 + this.lastHitDmg / 60 + this.instability * 0.5, 0.45, 1.30);
  }
  this.wasDown = down;

  if (!down) {
    if (this.getUpT > 0) {
      // 站起来了：收尾，给无敌窗口
      this.getUpT = 0;
      this.invuln = Math.max(this.invuln, 0.45);
      FX.ring(this.p.pelvis.x, this.footY(), 22, '#6b5c46');
      FX.dust(this.p.pelvis.x, this.footY(), this.face);
      SFX.tone(180, 320, 0.16, 'triangle', 0.10);
    }
    return;
  }
  if (this.downT < this.downDelay) return;      // 还在挨揍的余韵里
  if (this.getUpT <= 0) this.getUpT = 0.0001;   // 开始挣扎
  this.getUpT += dt;
  var t = clamp(this.getUpT / this.getUpDur, 0, 1);
  var p = this.p;
  // 玩家推摇杆能加快爬起来（最多省 35% 时间）
  var help = this.input && Math.abs(this.input.x) > 0.4 ? 1.35 : 1;
  if (help > 1) this.getUpT += dt * 0.35;

  // 阶段一：手撑地把上身顶起来；阶段二：腰腹发力站直
  var push = Math.sin(t * Math.PI * 0.9) * help;
  var gu = 2400 * push;
  p.chest.addF(0, -gu * p.chest.m);
  p.head.addF(0, -gu * 0.7 * p.head.m);
  p.pelvis.addF(0, -gu * 0.85 * p.pelvis.m);
  p.handL.addF(0, gu * 0.5 * p.handL.m);    // 手往下撑
  p.handR.addF(0, gu * 0.5 * p.handR.m);
  // 脚往回收，准备蹬地
  p.kneeL.addF(this.face * 300 * push * p.kneeL.m, -gu * 0.3 * p.kneeL.m);
  p.kneeR.addF(this.face * 300 * push * p.kneeR.m, -gu * 0.3 * p.kneeR.m);
  // 起身时肌肉全力往"站直"使劲（这就是挣扎感，不是播动画）
  this.mSpine.worldTarget = -Math.PI / 2;
  this.getUpPush = push;
  if (Math.random() < 0.25) FX.dust(p.chest.x + rand(-12, 12), this.footY() + rand(0, 8), this.face);
};

/* ---------- 移动：单摇杆 ---------- */
Fighter.prototype.locomote = function (dt, game, mf, gnd) {
  var p = this.p, inp = this.input;
  var sp = 340 * this.speedMul() * (0.55 + 0.45 * clamp(mf, 0, 2));
  var maxSp = sp;
  if (inp.x !== 0) this.face = inp.x > 0 ? 1 : -1;

  // ---- 站桩：没输入、已站稳 → 锁死，不再自己晃 ----
  var wantMove = Math.abs(inp.x) > 0.15 || Math.abs(inp.y) > 0.5 || inp.jump;
  var calm = Math.abs(p.pelvis.vsx()) < 130 && Math.abs(p.pelvis.vsy()) < 150;
  if (this.recoilT > 0) this.recoilT -= dt;      // 后坐滑行窗口：期间不锁桩
  if (!wantMove && gnd && calm && !this.isDown() && !(this.recoilT > 0)) this.idleLock = (this.idleLock || 0) + dt;
  else this.idleLock = 0;
  if (this.idleLock > 0.16) {
    // 只保留"别瘫下去"的最小支撑 + 脚掌抓地，其余驱动全部关掉
    var fyi = Math.min(p.footL.y, p.footR.y);
    var tgtHi = 48, dyi = (fyi - tgtHi) - p.pelvis.y;
    var sFi = clamp(dyi * 60 - p.pelvis.vsy() * 3.0, -1200, 2200) * clamp(mf, 0, 2.2);
    p.pelvis.addF(0, sFi * p.pelvis.m); p.chest.addF(0, sFi * p.chest.m * 0.4);
    p.footL.addF(0, -sFi * p.footL.m * 0.5); p.footR.addF(0, -sFi * p.footR.m * 0.5);
    if (p.footL.grounded) p.footL.addF(-p.footL.vsx() * 9 * p.footL.m, 0);
    if (p.footR.grounded) p.footR.addF(-p.footR.vsx() * 9 * p.footR.m, 0);
    // 水平残余速度也刹掉：坡上不会自己滑
    var vxr = (p.pelvis.vsx() * p.pelvis.m + p.chest.vsx() * p.chest.m) / (p.pelvis.m + p.chest.m);
    p.pelvis.addVel(-vxr * 0.9, 0); p.chest.addVel(-vxr * 0.9, 0);
    p.kneeL.addVel(-vxr * 0.8, 0); p.kneeR.addVel(-vxr * 0.8, 0);
    p.footL.addVel(-p.footL.vsx() * 0.8, 0); p.footR.addVel(-p.footR.vsx() * 0.8, 0);
    // 肌肉目标直接钉在当前角度：不再往标准站姿回正，所以不会自己扭
    this.freezeMuscles();
    this.walkPhase = 0;
    return;
  }
  // 冲刺
  if (this.dashT > 0) {
    this.dashT -= dt;
    // 冲刺沿摇杆方向（八方向），不再只是左右
    var tvx = this.dashVx * 1280, tvy = this.dashVy * 1280;
    var dbody = [p.head, p.neck, p.chest, p.pelvis, p.elbL, p.handL, p.elbR, p.handR, p.kneeL, p.footL, p.kneeR, p.footR];
    for (var di = 0; di < dbody.length; di++) {
      var dq = dbody[di];
      dq.addVel((tvx - dq.vsx()) * 0.45, (tvy - dq.vsy()) * 0.45 + dq.vsy() * -0.10);
    }
    if (Math.random() < 0.8) FX.dust(p.pelvis.x - this.dashVx * 10, this.footY(), this.dashVx);
  } else {
    var dvx = inp.x * maxSp;
    // 驱动：直接把身体水平速度朝目标拉（被打懵 / 失衡 / 离地时力气变小）
    var idle = Math.abs(inp.x) < 0.15;
    var cur = (p.pelvis.vsx() * p.pelvis.m + p.chest.vsx() * p.chest.m) / (p.pelvis.m + p.chest.m);
    var drive = idle ? 0.34 : 0.24;
    drive *= clamp(mf, 0.12, 2) * (1 - 0.45 * clamp(this.instability, 0, 1));
    if (!gnd) drive *= 0.3;
    var delta = (dvx - cur) * clamp(drive, 0, 0.6);
    var body = [p.head, p.neck, p.chest, p.pelvis, p.elbL, p.handL, p.elbR, p.handR];
    for (var bi = 0; bi < body.length; bi++) body[bi].addVel(delta, 0);
    p.kneeL.addVel(delta * 0.75, 0); p.kneeR.addVel(delta * 0.75, 0);
    p.footL.addVel(delta * 0.5, 0); p.footR.addVel(delta * 0.5, 0);
  }
  // 跳跃
  if (inp.jump && gnd && this.groundedT > 0.08) {
    inp.jump = false;
    // 按"目标高度"反推初速度，而不是写死一个速度值 ——
    // 这样不管角色高矮、重力怎么调，跳起来的高度都稳定在设定比例上。
    // 真实普通人垂直起跳：脚离地约 0.4m，身高 1.75m → 约 0.22 倍身高
    var bodyH = Math.max(40, len2(p.head.x - p.footL.x, p.head.y - p.footL.y));
    var frac = 0.22 * (this.game && this.game.cfg ? clamp(this.game.cfg.jumpMul, 0.2, 3) : 1);
    // 空中肌肉会继续伸展，实测额外加成约 1.35 倍，这里预先扣掉
    var jv = Math.sqrt(2 * PHYS.gravity * bodyH * frac) / 1.35
             * (this.st.weightless > 0 ? 2.5 : 1) * (this.wep.springShoes ? 2.6 : 1);
    // 真实起跳是"腿蹬地"：躯干拿到全部速度，腿只有一部分（腿在伸展，不是跟着一起飞）
    var torso = [p.head, p.neck, p.chest, p.pelvis, p.elbL, p.handL, p.elbR, p.handR];
    var legs = [p.kneeL, p.footL, p.kneeR, p.footR];
    for (var i = 0; i < torso.length; i++) torso[i].addVel(0, -jv);
    for (var j2 = 0; j2 < legs.length; j2++) legs[j2].addVel(0, -jv * 0.45);
    FX.ring(p.pelvis.x, this.footY(), 16, '#6b5c46'); SFX.tone(320, 180, 0.12, 'triangle', 0.12);
  }
  // 自动跨台阶：撞到矮台阶时自己迈上去（高台才需要真跳）
  var moving = Math.abs(inp.x) > 0.25;
  var spdNow = Math.abs(p.pelvis.vsx());
  if (gnd && moving && spdNow < 120) {
    this.stuckT = (this.stuckT || 0) + dt;
    if (this.stuckT > 0.12) {
      this.stuckT = 0;
      var probeX = p.pelvis.x + inp.x * 32;
      var fy0 = this.footY();
      var topY = this.world.groundTopAt(probeX, fy0 + 10);
      var rise = fy0 - topY;
      if (rise > 10 && rise < 92) {
        var jv = Math.sqrt(2 * PHYS.gravity * (rise + 16)) * 1.15;
        var allp = [p.head, p.neck, p.chest, p.pelvis, p.elbL, p.handL, p.elbR, p.handR, p.kneeL, p.footL, p.kneeR, p.footR];
        for (var pi = 0; pi < allp.length; pi++) allp[pi].addVel(inp.x * 190, -jv);
        FX.dust(p.pelvis.x, this.footY(), inp.x);
      }
    }
  } else this.stuckT = 0;
  // 真卡死了（有输入却原地不动）：强制起跳 + 侧向挣脱，玩家和 AI 都适用
  if (gnd && moving && Math.abs(p.pelvis.vsx()) < 30) {
    this.hardStuckT = (this.hardStuckT || 0) + dt;
    if (this.hardStuckT > 0.38) {
      this.hardStuckT = 0;
      var escX = inp.x !== 0 ? inp.x : this.face;
      var allp2 = [p.head, p.neck, p.chest, p.pelvis, p.elbL, p.handL, p.elbR, p.handR, p.kneeL, p.footL, p.kneeR, p.footR];
      for (var pi2 = 0; pi2 < allp2.length; pi2++) allp2[pi2].addVel(escX * 300, -Math.sqrt(2 * PHYS.gravity * 96) * 1.05);
      FX.dust(p.pelvis.x, this.footY(), escX);
      FX.ring(p.pelvis.x, this.footY(), 18, '#8a7a60');
    }
  } else this.hardStuckT = 0;

  // 脚掌抓地：站住时不许滑（被油/冰削弱）
  if (p.footL.grounded) p.footL.addF(-p.footL.vsx() * 2.2 * p.footL.m, 0);
  if (p.footR.grounded) p.footR.addF(-p.footR.vsx() * 2.2 * p.footR.m, 0);
  // 站立支撑：腿部推地（力有上限 → 被重击就撑不住）
  var fy = Math.min(p.footL.y, p.footR.y);
  var tgtH = (inp.y > 0.5 ? 26 : 48);
  var targetY = fy - tgtH;
  var dy = targetY - p.pelvis.y;
  var standF = clamp(dy * 60 - p.pelvis.vsy() * 3.0, -1200, 2200) * clamp(mf, 0, 2.2);
  if (gnd || p.footL.grounded || p.footR.grounded) {
    p.pelvis.addF(0, standF * p.pelvis.m); p.chest.addF(0, standF * p.chest.m * 0.4);
    p.footL.addF(0, -standF * p.footL.m * 0.5); p.footR.addF(0, -standF * p.footR.m * 0.5);
  }
  // 重心回正（腰腹）
  var lean = (p.chest.x - p.pelvis.x);
  var leanV = (p.chest.vsx() - p.pelvis.vsx());
  p.chest.addF(-(lean * 50 + leanV * 1.2) * clamp(mf, 0, 2) * p.chest.m, 0);

  // 走路循环
  var speed = Math.abs(p.pelvis.vsx());
  if (gnd && Math.abs(inp.x) > 0.15 && speed > 20) {
    this.walkPhase += dt * clamp(speed / 90, 2, 16);
    var sw = clamp(speed / 300, 0, 1) * 0.75;
    var ph = this.walkPhase;
    this.mHipR.target = Math.PI + Math.sin(ph) * sw;
    this.mHipL.target = Math.PI + Math.sin(ph + Math.PI) * sw;
    this.mKnR.target = Math.PI - 0.1 - Math.max(0, Math.sin(ph + 1.2)) * sw * 1.5;
    this.mKnL.target = Math.PI - 0.1 - Math.max(0, Math.sin(ph + Math.PI + 1.2)) * sw * 1.5;
    this.mSpine.worldTarget = -Math.PI / 2 + Math.sin(ph * 2) * 0.05;
  } else {
    this.mHipR.target = approach(this.mHipR.target, Math.PI + (inp.y > 0.5 ? 0.5 : 0), dt * 6);
    this.mHipL.target = approach(this.mHipL.target, Math.PI + (inp.y > 0.5 ? 0.5 : 0), dt * 6);
    this.mKnR.target = approach(this.mKnR.target, inp.y > 0.5 ? Math.PI - 1.5 : Math.PI - 0.1, dt * 6);
    this.mKnL.target = approach(this.mKnL.target, inp.y > 0.5 ? Math.PI - 1.5 : Math.PI - 0.1, dt * 6);
  }
  // 喷气背包 / 滑板
  if (this.wep.jetpack && (inp.y < -0.3 || !gnd)) {

/* ---------- 武器姿态 & 自动攻击 ---------- */
Fighter.prototype.aimAngle = function (game) {
  var tgt = game.nearestEnemy(this);

  if (tgt) {

    // 按平抛公式抬高瞄准角：下落量 = ½·g·t²，t = 距离/速度
    var w = this.wep;
    if (w.t === 'launch' || w.t === 'bow') {
      var spd = w.spd || 520;
      var grav = PHYS.gravity * (w.grav === undefined ? 1 : (w.grav || 0));
      if (grav > 0.01 && spd > 1) {
        var dist = len2(ax, ay);
        var tt = dist / spd;
        ay -= 0.5 * grav * tt * tt;         // 抬高，抵消下落

};

  var shoulderTgt = aim - spineA;

  this.mShL.target = wrapA(shoulderTgt) * 0.85;
  var reach = w.gun || w.bow || w.twoHand ? 0.06 : 0.3;
  this.mElR.target = Math.PI - reach; this.mElL.target = Math.PI - reach - 0.15;

    var e = t < 0.35 ? (t / 0.35) : 1;

    // 这一项让"够得远"和"打得疼"变成两个方向的取舍，长武器不能再两头通吃。
    var inertia = 1 + 0.45 * Math.pow((w.len || 30) / 64, 2);
    if (w.chain) inertia = 1 + 0.30 * Math.pow((w.len || 30) / 64, 2);   // 链是分段带动，比整根硬杆好甩
    // 软兵器：扭矩给足（链首带动整条链），但 kp 调低 → 越往末端滞后越明显，鞭梢效应
    if (w.chain) { wt.torque = 1900 / inertia * clamp(mf, 0.1, 2.2); wt.kp = 26; }
    else { wt.torque = 1300 / inertia * (w.heavy ? 0.62 : 1) * clamp(mf, 0.1, 2.2); wt.kp = 60; }

function ease(t) { t = clamp(t, 0, 1); return t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2; }

/* ---------- 受击 ---------- */
Fighter.prototype.hurt = function (dmg, src, kind) {
  if (this.dead) return 0;
  if (this.invuln > 0 && kind !== 'env') return 0;
  if (this.scarecrow > 0) { this.scarecrow = 0; FX.poof(this.center().x, this.center().y); return 0; }
  this.hp -= dmg;
  this.instability = clamp(this.instability + dmg / 55, 0, 1);
  this.flashT = 0.09;
  this.squash = 1 - clamp(dmg / 60, 0, 0.3);

};
Fighter.prototype.applyHit = function (opt) {
  // opt:{dmg, nx, ny, x, y, src, kind, power(0..1), part}
  var dmg = opt.dmg * ((this.game && this.game.cfg) ? clamp(this.game.cfg.dmgMul, 0.1, 5) : 1), p = this.p;
  // 统一统计：任何来源的伤害都记在攻击者头上（自伤不算）
  if (opt.src && opt.src !== this && dmg > 0 && !this.dead) {
    opt.src.hitsDealt++; opt.src.dmgDealt += dmg;
    if (dmg > opt.src.maxHit) opt.src.maxHit = dmg;
  }
  this.lastHitDmg = Math.max(this.lastHitDmg * 0.6, dmg);
  var real = this.hurt(dmg, opt.src, opt.kind);
  if (real <= 0) return;
  if (opt.part && this.part[opt.part] !== undefined) {
    this.part[opt.part] = Math.max(0, this.part[opt.part] - opt.pw * 1.6);
  }
  // 冲量：作用于被击部位，其余部位延迟传导（力传导延迟）
  var imp = opt.power * (opt.src ? 1 : 1);
  var pts = this.ptsNear(opt.x, opt.y, 26);
  var dirx = opt.nx, diry = opt.ny;

    q.addVel(dirx * imp * (0.9 + 0.3 * Math.random()), diry * imp * (0.9 + 0.3 * Math.random()));
  }
  // 上仰 30°，翻着飞更好看
  var all = [p.head, p.neck, p.chest, p.pelvis, p.elbL, p.handL, p.elbR, p.handR, p.kneeL, p.footL, p.kneeR, p.footR];
  var lift = imp * 0.35;
  for (var j = 0; j < all.length; j++) all[j].addVel(dirx * imp * 0.25, -lift * 0.4);
  // ---- 鬼畜布娃娃：关节更松 + 受击后乱甩乱弹 ----
  var RD = (this.game && this.game.cfg) ? (this.game.cfg.ragdoll || 0) : 0;
  if (RD > 0) {
    var K = RD === 2 ? 2.1 : (RD === 1 ? 1.3 : 1.0);
    // 关键：受击瞬间进入无骨状态 —— 关节限位全关，人真的散成一摊
    this.setBoneless(RD);
    this.bonelessT = 0.9 + 0.7 * K;
    this.floppy = 1.15 + 0.3 * K;            // 肌肉松开（骨头没了，谁也撑不住）
    this.floppyT = 0.9 + 0.7 * K;
    var spin = imp * (RD === 2 ? 0.055 : 0.032);
    // 各部位独立乱甩：这是"鬼畜"感的来源
    for (var q2 = 0; q2 < all.length; q2++) {
      var qp = all[q2];
      qp.addVel((Math.random() - 0.5) * imp * 0.5 * K, (Math.random() - 0.5) * imp * 0.5 * K - imp * 0.1);
    }
    p.head.addVel(rand(-1, 1) * imp * 0.35 * K, -rand(0.2, 1) * imp * 0.45 * K);
    p.pelvis.addVel(dirx * imp * 0.2, -imp * 0.3);
    // 角动量：整个人转起来
    var spinDir = (Math.random() < 0.5 ? -1 : 1) * spin;
    p.head.addVel(-spinDir * 60, 0); p.footL.addVel(spinDir * 80, 0); p.footR.addVel(spinDir * 80, 0);
    p.handL.addVel(-spinDir * 70, -40); p.handR.addVel(spinDir * 70, -40);

      this.instability = clamp(this.instability + 0.2, 0, 1);

    this.game.shake(clamp(dmg * 0.8, 2, 18), dirx, diry);

  SFX.hit(clamp(dmg / 40, 0.2, 1.3), opt.kind === 'fire' ? 'fire' : (opt.metal ? 'metal' : 'wood'));
  if (opt.status) this.addStatus(opt.status, opt.statusT || 2.2);

Fighter.prototype.ptsNear = function (x, y, r) {

Fighter.prototype.updDead = function (dt, game) {

  }
};

  W({ k: 'parachute', n: '降落伞', c: '位移', d: '按住就缓降。从高处被打飞时的保命符，也是占据制空权的关键。', t: 'util', u: 'parachute', mass: 0.8, cd: 0, reach: 0, parachute: 1 }),

/* ---------- 抛射体 ---------- */
function mkProj(o) {
  o.life = o.life || 2; o.grav = o.grav === undefined ? 1 : o.grav; o.age = 0;
  o.px = o.x; o.py = o.y; o.dead = false; o.spin = 0; o.stuck = false; o.hitList = [];
  return o;
}
function updateProj(p, dt, game) {
  if (p.dead) return;
  p.age += dt;
  if (p.stuck) { p.life -= dt * 0.2; if (p.life <= 0) p.dead = true; return; }
  if (p.fuse > 0) { p.fuse -= dt; if (p.fuse <= 0) { detonate(p, game); return; } }
  if (p.remote && p.armed && p.age > 0.5 && (p.owner.wep.proj === 'c4') && Math.random() < 0.012) { detonate(p, game); return; }
  if (p.homing && p.target && !p.target.dead) {
    var tc = p.target.center();
    var want = Math.atan2(tc.y - p.y, tc.x - p.x);
    var cur = Math.atan2(p.vy, p.vx);
    var da = wrapA(want - cur);
    var turn = clamp(da, -p.homing * dt, p.homing * dt);
    var sp = len2(p.vx, p.vy);
    p.vx = Math.cos(cur + turn) * sp; p.vy = Math.sin(cur + turn) * sp;
  }
  if (p.kind === 'boomerang') { p.vx *= (1 - 0.9 * dt); }
  if (p.kind === 'blackhole') {
    for (var i = 0; i < game.fighters.length; i++) {
      var e = game.fighters[i];
      var dx = p.x - e.center().x, dy = p.y - e.center().y, d = len2(dx, dy);
      if (d > 260 || d < 1) continue;
      var f2 = 900 * (1 - d / 260);
      e.p.chest.addF(dx / d * f2 * e.p.chest.m, dy / d * f2 * e.p.chest.m);
      e.p.pelvis.addF(dx / d * f2 * e.p.pelvis.m, dy / d * f2 * e.p.pelvis.m);
    }
    game.projectAll(p.x, p.y, 260, 300, p.x, p.y);
  }
  p.vy += PHYS.gravity * p.grav * dt;
  p.px = p.x; p.py = p.y;
  p.x += p.vx * dt; p.y += p.vy * dt;
  p.spin += dt * 12;
  // 世界碰撞
  var tmp = new Pt(p.x, p.y, 1, p.r);
  var solids = game.world.solids;
  for (var s = 0; s < solids.length; s++) {
    var so = solids[s];
    if (so.type === 'box') {
      if (p.x > so.x - p.r && p.x < so.x + so.w + p.r && p.y > so.y - p.r && p.y < so.y + so.h + p.r) {
        onProjSolid(p, game, so, tmp); break;
      }
    } else {
      var r = segSegDist2(so.x1, so.y1, so.x2, so.y2, p.px, p.py, p.x, p.y);
      if (r.d2 < p.r * p.r) { onProjSolid(p, game, so, tmp); break; }
    }
  }
  // 命中角色
  if (!p.nohit || p.status) {
    for (var i2 = 0; i2 < game.fighters.length; i2++) {
      var e2 = game.fighters[i2];
      if (e2 === p.owner || e2.dead) continue;
      if (p.owner && e2.team === p.owner.team) continue;
      if (p.hitList.indexOf(e2) >= 0) continue;
      var best = null;
      for (var j = 0; j < e2.bones.length; j++) {
        var bo = e2.bones[j];
        var rr = segSegDist2(p.px, p.py, p.x, p.y, bo.a.x, bo.a.y, bo.b.x, bo.b.y);
        if (rr.d2 < (p.r + 8) * (p.r + 8) && (!best || rr.d2 < best.d2)) best = rr;
      }
      if (!best) continue;
      p.hitList.push(e2);
      projHit(p, e2, game, best.x, best.y);
      if (!p.pierce && !p.status) { p.dead = true; return; }
    }
  }
  // 重力球：把附近的人和东西往球心拉
  if (p.kind === 'gravball') {
    for (var gi = 0; gi < game.fighters.length; gi++) {
      var gf = game.fighters[gi]; if (gf.dead) continue;
      for (var gk2 in gf.p) {
        var gq = gf.p[gk2];
        var gdx = p.x - gq.x, gdy = p.y - gq.y, gd = len2(gdx, gdy);
        if (gd > 320 || gd < 8) continue;
        var gf2 = 1600 * (1 - gd / 320);
        gq.addF(gdx / gd * gf2 * gq.m, gdy / gd * gf2 * gq.m);
      }
    }
    for (var gr2 = 0; gr2 < 3; gr2++) FX.lines.push({ x1: p.x + rand(-70, 70), y1: p.y + rand(-70, 70), x2: p.x, y2: p.y, t: 0, dur: 0.3, col: '#6b4a7a', w: 2 });
  }
  // 回旋利刃：飞到头后绕一个大圈从背后回来
  if (p.kind === 'boom2') {
    p.spin = (p.spin || 0) + dt * 22;
    if (!p.turning && p.life < 2.6) { p.turning = 1; p.ownerAtTurn = { x: p.owner.center().x, y: p.owner.center().y }; }
    if (p.turning) {
      var tdx = p.ownerAtTurn.x - p.x, tdy = p.ownerAtTurn.y - p.y, td = len2(tdx, tdy) || 1;
      p.vx += tdx / td * 900 * dt; p.vy += tdy / td * 900 * dt - 320 * dt;
    }
  }
  if (p.kind === 'spray' || p.kind === 'flame') {
    if (Math.random() < 0.6) FX.puff(p.x, p.y, p.col);
  }
  if (p.kind === 'dragon' && Math.random() < 0.9) FX.puff(p.x + rand(-8, 8), p.y + rand(-8, 8), '#3f6b5a');
  if (p.kind === 'missile' && Math.random() < 0.9) FX.puff(p.x - p.vx * 0.02, p.y - p.vy * 0.02, '#8a7a60');
  p.life -= dt;
  if (p.life <= 0) { if (p.kind === 'grenade' || p.kind === 'sticky' || p.kind === 'molotov' || p.kind === 'c4') detonate(p, game); else p.dead = true; }
  if (p.y > game.world.floorY + 200 || p.x < game.world.leftX - 200 || p.x > game.world.rightX + 200) p.dead = true;
}
function onProjSolid(p, game, so, tmp) {
  if (p.kind === 'molotov' || p.kind === 'firework') { detonate(p, game); return; }
  if (p.kind === 'icicle') { p.stuck = true; game.temps.push({ kind: 'ice', solid: game.world.addBox(p.x - 16, p.y - 4, 32, 8, { friction: 0.02, kind: 'ice' }), life: 8 }); return; }
  if (p.kind === 'portal') { game.openPortal(p); p.dead = true; return; }
  if (p.stick || p.kind === 'sticky' || p.kind === 'arrow' || p.kind === 'hook') {
    p.stuck = true; p.vx = 0; p.vy = 0;
    if (p.kind === 'hook') { p.owner.hook = { x: p.x, y: p.y, t: 0.9 }; }
    return;
  }
  // 反弹
  if (so.type === 'box') {
    var cx = Math.max(so.x, Math.min(p.x, so.x + so.w)), cy = Math.max(so.y, Math.min(p.y, so.y + so.h));
    var dx = p.x - cx, dy = p.y - cy, dl = len2(dx, dy) || 1;
    var nx = dx / dl, ny = dy / dl;
    p.x = cx + nx * (p.r + 0.5); p.y = cy + ny * (p.r + 0.5);
    var vn = p.vx * nx + p.vy * ny;
    p.vx -= (1 + (p.bounce || 0.4)) * vn * nx; p.vy -= (1 + (p.bounce || 0.4)) * vn * ny;
    p.vx *= 0.7; p.vy *= 0.7;
  } else {
    p.vx *= -(p.bounce || 0.4); p.vy *= -(p.bounce || 0.4);
    p.x = p.px; p.y = p.py;
  }
  if (p.kind === 'grenade' || p.kind === 'c4') SFX.tone(500, 300, 0.08, 'square', 0.08);
}
function projHit(p, e, game, cx, cy) {
  var nx = p.vx, ny = p.vy, nl = len2(nx, ny) || 1; nx /= nl; ny /= nl;
  if (p.kind === 'spray') {
    e.applyHit({ dmg: p.dmg, nx: nx * 0.3, ny: ny * 0.3, x: cx, y: cy, src: p.owner, kind: 'wind', power: 60, part: 'chest', pw: 2, wfx: p.w ? p.w.k : null });
    if (p.status) e.addStatus(p.status, p.statusT);
    p.dead = true; return;
  }
  var dmg = p.dmg;
  var power = clamp(dmg * (p.knock || 1) * 11, 40, 1600);
  var part = 'chest';
  var bd = 9999;
  for (var j = 0; j < e.bones.length; j++) {
    var bo = e.bones[j];
    var rr = segSegDist2(cx, cy, cx, cy, bo.a.x, bo.a.y, bo.b.x, bo.b.y);
    if (rr.d2 < bd) { bd = rr.d2; part = e.partOfBone(bo.na, bo.nb); }
  }
  e.applyHit({ dmg: dmg, nx: nx, ny: ny, x: cx, y: cy, src: p.owner, kind: p.kind === 'bullet' ? 'metal' : 'melee', power: power, part: part, pw: p.part || 6, metal: p.kind === 'bullet', wfx: p.w ? p.w.k : null });
  if (p.kind === 'glue') e.addStatus('freeze', 3);
  if (p.kind === 'bullet') FX.bloodDot(cx, cy);
}
function detonate(p, game) {
  p.dead = true;
  var R = p.kind === 'molotov' ? 92 : 130;
  var dmg = p.dmg || 20;
  FX.explode(p.x, p.y, R, p.kind === 'molotov' ? '#ff7a2f' : '#a8322d');
  SFX.boom(p.kind === 'molotov' ? 0.5 : 1);
  game.shake(clamp(R / 6, 8, 26), 0, 1);
  game.hitstop(6);
  if (p.kind === 'firework') {
    game.flashAll(p.x, p.y);
    for (var q = 0; q < 26; q++) FX.spark(p.x, p.y, 1, pick(['#a8322d', '#b8860b', '#3f6b5a', '#23201c']));
    return;
  }
  for (var i = 0; i < game.fighters.length; i++) {
    var e = game.fighters[i]; if (e.dead) continue;
    var d = len2(e.center().x - p.x, e.center().y - p.y);
    if (d > R) continue;
    var f2 = 1 - d / R;
    var nx = (e.center().x - p.x) / (d || 1), ny = (e.center().y - p.y) / (d || 1);
    e.applyHit({
      dmg: dmg * f2, nx: nx, ny: ny - 0.5, x: e.center().x, y: e.center().y,
      src: p.owner, kind: 'env', power: 900 * f2 * (p.knock || 1), part: 'chest', pw: 8
    });
    if (p.kind === 'molotov') e.addStatus('burn', 3.2);
  }
  // 燃烧瓶：留下持续火焰区（w.fire 标志以前从来没被实现过，所以"地面火焰区"是空的）
  if (p.w && p.w.fire) {
    var zone = { kind: 'firezone', x: p.x, y: p.y, r: 78, life: 5.5, owner: p.owner, tick: 0 };
    game.deployables.push(zone);
    for (var fz = 0; fz < 10; fz++) FX.parts.push({ x: p.x + rand(-70, 70), y: p.y + rand(-6, 6), vx: rand(-40, 40), vy: -rand(80, 220), life: rand(0.4, 1.0), max: 1.0, col: pick(['#ff7a2f', '#b8860b']), sz: rand(3, 8), g: -0.2, t: 'flame' });
  }
  game.projectAll(p.x, p.y, R, 700);
}

'use strict';
var AI_LEVELS = {

  hard: { n: '困难', react: 0.12, lead: 0.86, miss: 0.08, terrain: 0.85, aggr: 0.9, dash: 0.8 },
  nightmare: { n: '噩梦', react: 0.06, lead: 1.0, miss: 0.02, terrain: 1.0, aggr: 1.0, dash: 0.95 }
};
function Brain(f, game, lvl) {
  this.f = f; this.game = game; this.L = AI_LEVELS[lvl] || AI_LEVELS.normal;
  this.think = 0; this.intent = { x: 0, jump: false, dash: false };
  this.buf = []; this.jitter = rand(0, 6); this.retreat = 0; this.lastDanger = 0;
  // 防卡死：记录"想动却没动"的累计

/* 卡住检测：意图明确但位置几乎不变 → 强制脱困（跳 + 反向 + 冲刺） */
Brain.prototype.antistuck = function (dt, g) {
  var f = this.f;
  var cx = f.p.pelvis.x, cy = f.p.pelvis.y;
  var wantMove = Math.abs(f.input.x) > 0.4;
  var moved = Math.abs(cx - this.lastX);
  this.lastX = cx;
  if (this.jumpCd > 0) this.jumpCd -= dt;
  if (this.unstickT > 0) {
    this.unstickT -= dt;
    f.input.x = this.unstickDir;
    if (this.jumpCd <= 0 && Math.random() < 0.06) { f.input.jump = true; this.jumpCd = 0.5; }
    return;
  }
  if (wantMove && moved < 0.9) this.stuckT += dt; else this.stuckT = Math.max(0, this.stuckT - dt * 2);
  if (this.stuckT > 0.9) {

Brain.prototype.update = function (dt) {

  // 感知缓冲（反应延迟）
  this.buf.push({ x: tgt.center().x, y: tgt.center().y, vx: tgt.vel().x, vy: tgt.vel().y, t: g.time });
  if (this.buf.length > 90) this.buf.shift();
  var want = g.time - this.L.react;
  var per = this.buf[0];
  for (var i = this.buf.length - 1; i >= 0; i--) { if (this.buf[i].t <= want) { per = this.buf[i]; break; } }
  // 烟雾/闪光 → AI 真的看不见
  if (f.st.blind > 0) { per = { x: per.x + rand(-160, 160), y: per.y + rand(-80, 80), vx: 0, vy: 0 }; }
  var lead = this.L.lead;
  var px = per.x + per.vx * lead * 0.14, py = per.y + per.vy * lead * 0.06;
  this.think -= dt;
  if (this.think <= 0) {

    this.plan(px, py, tgt);

  // 即时避险（不受 think 节流）
  var dg = g.dangerAt(f.center().x, f.center().y, f);
  if (dg > 0.45) {
    var esc = g.escapeDir(f.center().x, f.center().y, f, dg);
    if (esc !== 0 && Math.random() < 0.4 + this.L.terrain * 0.6) {

  }
  if (Math.random() < this.L.miss * 0.02) this.intent.x *= -1;   // 失误
  f.input.x = clamp(this.intent.x + Math.sin(g.time * 3 + this.jitter) * 0.12, -1, 1);
  if (this.intent.dash && f.dashCd <= 0) {
    f.tryDash(tgt ? (tgt.center().x - f.center().x) : f.face, f.intentJump ? -0.35 : 0);

  }
  f.input.dash = false;
  if (this.intent.jump) { f.input.jump = true; this.intent.jump = false; }

  // 推敌人下悬崖：把目标往危险区挤
  if (this.L.terrain > 0.5 && tgt && g.dangerAt(tgt.center().x + (tgt.center().x - f.center().x) * 0.2, tgt.center().y, f) > 0.15) {

Brain.prototype.plan = function (px, py, tgt) {
  var f = this.f, g = this.game, w = f.wep, L = this.L;

  if (w.t === 'gun') ideal = 300;
  else if (w.t === 'launch' || w.t === 'bow') ideal = 330;
  else if (w.t === 'cone') ideal = 70;
  else if (w.t === 'deploy' || w.t === 'potion' || w.t === 'util') ideal = 140;
  else if (w.t === 'melee') ideal = (w.reach || 60) * 0.55;
  if (w.long) ideal = (w.reach || 100) * 0.85;
  var dir = sgn(dx);

  var punish = (tgt.isDown() || tgt.instability > 0.5) ? 1 : 0;
  if (this.retreat > 0) { this.retreat -= 0.15; this.intent.x = -dir; if (d > ideal * 1.6) this.retreat = 0; return; }
  if (f.hp < 26 && Math.random() < 0.5 * (1 - L.aggr)) { this.retreat = 1.2; this.intent.x = -dir; return; }
  if (d > ideal + 70) this.intent.x = dir * (punish ? 1 : 0.85);
  else if (d < ideal - 70) this.intent.x = -dir * 0.9;
  else this.intent.x = dir * (Math.random() < 0.5 ? 0.25 : -0.25);
  // 上下走位（绕背 / 上台）
  var above = py < c.y - 60;
  if (above && Math.random() < 0.5 + L.aggr * 0.3) this.intent.jump = true;
  if (w.t === 'melee' && d > 260 && f.dashCd <= 0 && Math.random() < L.dash * (punish ? 1.6 : 0.7)) this.intent.dash = true;
  if (w.t === 'gun' && d < 90 && Math.random() < 0.5) this.intent.dash = true;

  var dg = g.dangerAt(c.x, c.y, f);
  if (dg > 0.3 && Math.random() < L.terrain) {
    var esc = g.escapeDir(c.x, c.y, f, dg);
    if (esc !== 0) this.intent.x = esc;
  }

  var ed = g.edgeDanger(c.x, c.y, f);

    var back = (c.x < (g.map.ring ? (g.map.ring.x0 + g.map.ring.x1) / 2 : (g.world.leftX + g.world.rightX) / 2)) ? 1 : -1;

    if (ed > 0.6 && f.dashCd <= 0 && Math.random() < 0.5) this.intent.dash = true;

    if (ed > 0.85) { this.intent.dash = true; this.retreat = 0; }
  }
};

  }
  _polyCache[key] = pts;
  return pts;

    var R = mulberry(seed >>> 0);
    var war = game && game.mode === 'war';
    var pool = MAPS.themes.filter(function (t) { return war ? t.k !== 'ring' : true; });
    var main = pool[Math.floor(R() * pool.length)];
    var second = pool[Math.floor(R() * pool.length)];
    if (second.k === main.k) second = pool[(pool.indexOf(main) + 3) % pool.length];
    var w = game.world = new World();
    var GY = 560;
    // 大战场：加宽地图、多出生点
    var RX = war ? 3400 : 1740, LX = war ? -600 : -140;
    w.leftX = LX - 100; w.rightX = RX + 100; w.floorY = 1000;
    var out = { name: main.n + '·' + second.v, verb: main.v, main: main.k, second: second.k, hazards: [], spawns: [], bg: {}, war: war, ring: null };
    var sn = war ? Math.min(30, 12 + (game.cfg ? game.cfg.enemies : 1) * 6) : 2;
    var x0 = LX + 220, x1 = RX - 220;
    if (game.map && game.map.ringHint) { }
    for (var si = 0; si < sn; si++) {
      var t = sn === 1 ? 0.5 : si / (sn - 1);
      // 错开落点，避免出生时叠在一起互相挤飞
      var spx = x0 + t * (x1 - x0);
      out.spawns.push({ x: spx, y: GY - 150 - (si % 2) * 90 });
    }
    // ---- 基础地面（可能带缺口） ----
    var gap = (main.k === 'cliff' || second.k === 'cliff' || main.k === 'lava' || second.k === 'lava' || R() < 0.35);
    if (gap) {
      var gx = 620 + R() * 400, gw = 150 + R() * 190;
      w.addBox(LX - 100, GY, gx - LX + 300, 220, { friction: GROUND_FRICTION });
      w.addBox(gx + gw, GY, RX - gx - gw + 100, 220, { friction: GROUND_FRICTION });
      out.pit = { x: gx, w: gw, y: GY };
    } else {
      w.addBox(LX - 100, GY, RX - LX + 200, 220, { friction: GROUND_FRICTION });
    }
    // ---- 斜坡 / 平台 ----
    var hasSlope = main.k === 'slope' || second.k === 'slope' || R() < 0.5;
    if (hasSlope) {
      var sx = 200 + R() * 300;
      w.addBox(sx, GY - 96, 240, 96, { friction: GROUND_FRICTION });
      w.addSeg(sx + 240, GY - 96, sx + 400, GY, { friction: GROUND_FRICTION });
      w.addBox(RX - 560 - R() * 300, GY - 110, 220, 110, { friction: GROUND_FRICTION });
      w.addSeg(RX - 720, GY, RX - 560 - R() * 300, GY - 110, { friction: GROUND_FRICTION });
    }
    var pn = war ? 10 : 3;
    for (var i = 0; i < pn; i++) {
      var px = LX + 200 + i * ((RX - LX - 400) / pn) + R() * 120, py = GY - 150 - R() * 120;
      w.addBox(px, py, 130 + R() * 90, 16, { friction: 0.5, plat: 1 });
    }
    // 出界擂台：拆掉围栏，地面只有中间一段，掉下去就出界
    if (main.k === 'ring' || second.k === 'ring') {
      w.solids.length = 0;
      w.addBox(320, GY, 1040, 220, { friction: GROUND_FRICTION });
      w.addBox(430, GY - 120, 190, 16, { friction: 0.5, plat: 1 });
      w.addBox(1060, GY - 150, 210, 16, { friction: 0.5, plat: 1 });
      w.addSeg(320, GY, 430, GY - 66, { friction: GROUND_FRICTION });
      w.addSeg(1360, GY, 1270, GY - 74, { friction: GROUND_FRICTION });
      w.leftX = -2600; w.rightX = 4200; w.floorY = 1400;
      out.ring = { x0: 300, x1: 1370, y: GY + 300 };
      out.name = '悬空擂台·打出去';
    } else {
      w.addBox(LX - 140, GY - 400, 60, 620, { friction: 0.3 });
      w.addBox(RX + 80, GY - 400, 60, 620, { friction: 0.3 });
    }
    // ---- 主机制 ----
    this.hazard(main.k, w, out, R, GY);
    this.hazard(second.k, w, out, R, GY);
    // 出生点必须是"头顶没东西、脚下有地"的空位，否则会被地形挤飞
    var used = [];
    for (var q = 0; q < out.spawns.length; q++) {
      var sx3 = MAPS.clearSpot(w, out.spawns[q].x, GY);
      // 与已用的出生点至少隔 150px，否则左右挪
      for (var u = 0; u < used.length; u++) {
        if (Math.abs(sx3 - used[u]) < 150) { sx3 = used[u] + (sx3 >= used[u] ? 170 : -170); break; }
      }
      sx3 = clamp(sx3, w.leftX + 120, w.rightX - 120);
      used.push(sx3); out.spawns[q].x = sx3;
    }
    out.bg = { hue: Math.floor(R() * 4), far: R() };
    out.style = MAPSTYLE[main.k] || MAPSTYLE.slope;
    out.style2 = MAPSTYLE[second.k] || out.style;
    return out;
  },
  clearSpot: function (w, x0, GY) {
    var cands = [x0, x0 + 70, x0 - 70, x0 + 150, x0 - 150, x0 + 260, x0 - 260, 700, 900, 500, 1100];
    for (var i = 0; i < cands.length; i++) {
      var x = cands[i];
      if (x < 90 || x > 1470) continue;
      var clear = true, ground = false;
      for (var s = 0; s < w.solids.length; s++) {
        var so = w.solids[s];
        if (so.type === 'box') {
          if (x + 26 > so.x && x - 26 < so.x + so.w && GY - 160 < so.y + so.h && GY - 30 > so.y) { clear = false; break; }
          if (so.x < x + 18 && so.x + so.w > x - 18 && so.y >= GY - 30 && so.y < GY + 120) ground = true;
        } else {
          var mnx = Math.min(so.x1, so.x2), mxx = Math.max(so.x1, so.x2);
          var mny = Math.min(so.y1, so.y2), mxy = Math.max(so.y1, so.y2);
          if (x + 26 > mnx && x - 26 < mxx && GY - 160 < mxy && GY - 30 > mny) { clear = false; break; }
          if (mnx < x + 18 && mxx > x - 18 && mny >= GY - 30 && mny < GY + 120) ground = true;
        }
      }
      if (clear && ground) return x;
    }
    return x0;
  },
  hazard: function (k, w, out, R, GY) {
    var h = null;
    if (k === 'train') {
      h = { type: 'train', y: GY - 4, dir: R() < 0.5 ? 1 : -1, phase: 'idle', t: rand(2, 4), x: 0, speed: 1750, len: 300, h: 92, warn: 0 };
    } else if (k === 'cliff') {
      if (!out.pit) {
        var gx = 640 + R() * 300;
        w.solids.length = 0;
        w.addBox(-200, GY, gx + 200, 220, { friction: GROUND_FRICTION });
        w.addBox(gx + 260, GY, 1740 - gx - 260, 220, { friction: GROUND_FRICTION });
        out.pit = { x: gx, w: 260, y: GY };
      }
      h = { type: 'pit', x: out.pit.x, w: out.pit.w, y: GY };
    } else if (k === 'belt') {
      var bx = 300 + R() * 700, dir = R() < 0.5 ? 1 : -1;
      var s = w.addBox(bx, GY - 14, 320, 14, { friction: 0.9, belt: dir * 320, kind: 'belt' });
      h = { type: 'belt', x: bx, w: 320, y: GY - 14, dir: dir };
    } else if (k === 'lava') {
      var lx = out.pit ? out.pit.x : 700;
      var lw = out.pit ? out.pit.w : 260;
      var box = w.addBox(lx + 6, GY + 120, lw - 12, 90, { friction: 1, kind: 'lava' });
      box.onTouch = function (p, s) { if (p.onFire === undefined) p.onFire = 0; p.onFire = 1; };
      h = { type: 'lava', x: lx + 6, w: lw - 12, y: GY + 120, h: 90 };
    } else if (k === 'pend') {
      h = { type: 'pend', x: 800 + R() * 300, y: GY - 330, len: 200, ang: 0.9, sp: 1.5, r: 34, phase: R() * 6 };
    } else if (k === 'rock') {
      h = { type: 'rock', t: rand(1, 3), interval: rand(2.2, 3.6), rocks: [], gy: GY };
    } else if (k === 'spike') {
      var sx2 = 240 + R() * 900, sw = 200 + R() * 160;
      var sb = w.addBox(sx2, GY - 26, sw, 26, { friction: 0.5, kind: 'spike' });
      sb.onTouch = function (p, s) { p.onSpike = 1; };
      h = { type: 'spike', x: sx2, w: sw, y: GY - 26 };
    } else if (k === 'cannon') {
      h = { type: 'cannon', t: rand(1.5, 3), y: GY - 150 - R() * 90, dir: R() < 0.5 ? 1 : -1, phase: 'idle', warnT: 0 };
    } else if (k === 'wind') {
      h = { type: 'wind', x: 0, w: 1600, y: GY - 420, h: 420, dir: R() < 0.5 ? 1 : -1, t: 0, on: 1 };
    } else if (k === 'spring') {
      var pads = [];
      for (var q = 0; q < 4; q++) {
        var px2 = 240 + q * 340 + R() * 90;
        var pb = w.addBox(px2, GY - 18, 78, 18, { friction: 0.2, bounce: 1.25, kind: 'pad' });
        pads.push({ x: px2, w: 78, y: GY - 18 });
      }
      h = { type: 'spring', pads: pads };
    } else if (k === 'crush') {
      h = { type: 'crush', t: rand(2, 4), phase: 'idle', open: 0 };
    } else if (k === 'slope') {
      h = null;
    } else if (k === 'ring') {
      h = null;   // 地形已在 gen 里做成悬空擂台，出界判定走 G.map.ring
    } else if (k === 'roof') {
      // 阶梯屋顶：高低错落，摔下去要爬上来
      for (var rf = 0; rf < 5; rf++) {
        var rx = 180 + rf * 300 + R() * 60, ry = GY - 110 - rf * 40 - R() * 50;
        w.addBox(rx, ry, 150 + R() * 80, 18, { friction: 0.5, plat: 1 });
      }
      w.addBox(150, GY - 30, 120, 30, { friction: GROUND_FRICTION });
      h = null;
    } else if (k === 'ice') {
      // 全场低摩擦：刹不住，撞人更疼
      for (var si2 = 0; si2 < w.solids.length; si2++) w.solids[si2].friction = 0.02;
      w.addBox(300, GY - 8, 1100, 8, { friction: 0.005, kind: 'ice' });
      h = null;
    } else if (k === 'tower') {
      // 通天塔：垂直分层
      for (var lv = 0; lv < 4; lv++) {
        var ty = GY - 120 - lv * 130;
        w.addBox(lv % 2 ? 200 : 900, ty, 420, 16, { friction: 0.5, plat: 1 });
        if (lv < 3) w.addSeg(lv % 2 ? 620 : 900, ty, lv % 2 ? 900 : 620, ty - 130, { friction: 0.4 });
      }
      h = null;
    } else if (k === 'cave') {
      // 低矮天花板：站起来会撞头
      w.addBox(200, GY - 210, 1200, 24, { friction: 0.4, plat: 0 });
      w.addBox(500, GY - 250, 300, 40, { friction: 0.4 });
      for (var ci = 0; ci < 6; ci++) w.addBox(240 + ci * 200 + R() * 60, GY - 150, 18, 60, { friction: 0.3 });
      h = { type: 'rock', t: rand(1, 2.5), interval: rand(1.8, 3.0), rocks: [], gy: GY };
    } else if (k === 'ship') {
      // 摇晃甲板：整块地周期性倾斜（横向"重力"来回摆）
      h = { type: 'tilt', t: 0, period: 4.2, amp: 900 };
    } else if (k === 'arena') {
      // 斗兽场：两侧看台阶梯，中间死斗区
      for (var st = 0; st < 4; st++) {
        w.addBox(120, GY - 60 - st * 60, 220, 60, { friction: 0.5 });
        w.addBox(1300, GY - 60 - st * 60, 220, 60, { friction: 0.5 });
      }
      h = null;
    } else if (k === 'gravity') {
      // 重力反转：低矮封闭空间，重力周期上下翻
      w.addBox(200, GY - 300, 1200, 24, { friction: 0.4 });   // 天花板（反转后的"地面"）
      h = { type: 'gravFlip', t: 0, period: 7.0, phase: 0, warnT: 0 };
    } else if (k === 'zeroG') {
      h = { type: 'zeroG', t: 0, amount: 0.86 };
    } else if (k === 'portalMaze') {
      // 两扇门：进 A 出 B，速度守恒
      var pa = { x: 300 + R() * 200, y: GY - 90 }, pb = { x: 1100 + R() * 200, y: GY - 90 };
      h = { type: 'portals', a: { x: pa.x, y: pa.y, r: 40 }, b: { x: pb.x, y: pb.y, r: 40 }, cd: {} };
    } else if (k === 'water') {
      // 半沉水下：浮力 + 高阻尼
      h = { type: 'water', x: w.leftX + 100, w: (w.rightX - w.leftX) - 200, top: GY - 190, bottom: GY + 40 };
    } else if (k === 'collapse') {
      // 一踩就塌的地板
      var pads = [];
      for (var cp = 0; cp < 7; cp++) {
        var cbx = 240 + cp * 190 + R() * 60, cby = GY - 26;
        var sb = w.addBox(cbx, cby, 120, 26, { friction: 0.5 });
        pads.push({ s: sb, x: cbx, y: cby, w: 120, t: -1, gone: false });
      }
      h = { type: 'collapse', pads: pads };
    } else if (k === 'rise') {
      // 上涨熔岩：s.y 逐渐变小（往上淹）
      var topBox = w.addBox(w.leftX, GY + 60, w.rightX - w.leftX, 60, { friction: 1, kind: 'lava' });
      topBox.onTouch = function (p, s) { p.onFire = 1; };
      h = { type: 'rise', s: topBox, y0: GY + 60, yTop: GY - 260, speed: 11, t: 0 };
    } else if (k === 'tornado') {
      h = { type: 'tornado', x: 700 + R() * 400, y: GY - 220, r: 300, pull: 1500, swirl: 900, t: 0 };
    } else if (k === 'gear') {
      // 旋转齿轮：用旋转的线段逼近
      var gs = [];
      for (var gi = 0; gi < 2; gi++) {
        gs.push({ x: 420 + gi * 620, y: GY - 150 - R() * 60, r: 90 + R() * 50, ang: R() * 6, sp: (gi ? -1 : 1) * (0.7 + R() * 0.7), teeth: 8 });
      }
      h = { type: 'gear', gears: gs };
    } else if (k === 'elevator') {
      var lifts = [];
      for (var li = 0; li < 3; li++) {
        var eb = w.addBox(300 + li * 420, GY - 60, 150, 20, { friction: 0.6 });
        lifts.push({ s: eb, y0: GY - 60, amp: 170, sp: 0.5 + li * 0.22, ph: R() * 6 });
      }
      h = { type: 'elevator', lifts: lifts };
    } else if (k === 'magnetVein') {
      h = { type: 'magnet', x: 500 + R() * 500, y: GY - 180, r: 420, force: 2100 };
    } else if (k === 'avalanche') {
      h = { type: 'avalanche', t: rand(1, 3), interval: rand(2.4, 3.8), balls: [], gy: GY, x0: w.leftX + 150 };
    } else if (k === 'mirrorHall') {
      // 相位大厅：地面周期性出现"相位带"，踩上去会被甩到地图对称的另一侧
      h = { type: 'phase', bands: [], t: 0, interval: 4.2 };
      for (var pbi2 = 0; pbi2 < 3; pbi2++) h.bands.push({ x: 260 + pbi2 * 520 + R() * 120, w: 150, on: false, ph: pbi2 * 1.4 });
    } else if (k === 'coaster') {
      // 过山车轨道：大起大落
      w.addSeg(120, GY - 60, 620, GY - 300, { friction: 0.16 });
      w.addSeg(620, GY - 300, 1120, GY - 40, { friction: 0.16 });
      w.addSeg(1120, GY - 40, 1600, GY - 320, { friction: 0.16 });
      w.addBox(1120, GY - 40, 480, 40, { friction: 0.16 });
      h = null;
    } else if (k === 'pinball') {
      // 满地弹柱：被打飞后弹很久
      for (var pbi = 0; pbi < 9; pbi++) {
        var pbx = 220 + pbi * 160 + R() * 50, pby = GY - 120 - R() * 160;
        w.addBox(pbx, pby, 26, 26, { friction: 0.2, bounce: 1.55, kind: 'bumper' });
      }
      for (var pbs = 0; pbs < w.solids.length; pbs++) if (w.solids[pbs].kind !== 'lava') w.solids[pbs].bounce = Math.max(w.solids[pbs].bounce || 0, 0.75);
      h = null;
    } else if (k === 'ferris') {
      // 摩天轮：绕中心旋转的吊舱
      var cabs = [];
      for (var fi = 0; fi < 5; fi++) {
        var fb = w.addBox(0, 0, 110, 16, { friction: 0.6 });
        cabs.push({ s: fb, r: 200, ang: fi / 5 * TAU });
      }
      h = { type: 'ferris', cx: 840, cy: GY - 300, cabs: cabs, ang: 0, sp: 0.42 };
    } else if (k === 'quicksand') {
      var qsx = 400 + R() * 400, qsw = 340 + R() * 220;
      h = { type: 'quicksand', x: qsx, w: qsw, y: GY - 10, sink: {} };
    } else if (k === 'venom') {
      h = { type: 'venom', x: w.leftX + 100, w: (w.rightX - w.leftX) - 200, y: GY - 170, h: 175 };
    } else if (k === 'volcano') {
      var vx = 400 + R() * 700;
      h = { type: 'volcano', x: vx, y: GY, r: 190, phase: 'idle', t: rand(2, 4) };
    } else if (k === 'tightrope') {
      // 脚下一根钢丝：极窄
      w.solids.length = 0;
      w.addBox(-100, GY, 1900, 220, { friction: GROUND_FRICTION });   // 底下是深渊(视觉)
      w.addBox(200, GY - 8, 1240, 8, { friction: 0.22 });             // 钢丝本体
      w.addBox(420, GY - 150, 90, 14, { friction: 0.4, plat: 1 });
      w.addBox(1140, GY - 170, 90, 14, { friction: 0.4, plat: 1 });
      h = null;
    } else if (k === 'blades') {
      var bl = [];
      for (var bi2 = 0; bi2 < 4; bi2++) bl.push({ x: 320 + bi2 * 340 + R() * 60, y: GY - 120 - R() * 130, len: 80 + R() * 50, ang: R() * 6, sp: (bi2 % 2 ? -1 : 1) * (2.2 + R() * 1.8) });
      h = { type: 'blades', blades: bl };
    } else if (k === 'jigsaw') {
      var tiles = [];
      for (var ti = 0; ti < 8; ti++) {
        var tb = w.addBox(180 + ti * 190, GY - 22, 130, 22, { friction: 0.5 });
        tiles.push({ s: tb, x: 180 + ti * 190, y: GY - 22, w: 130, off: false, ph: ti * 0.8 });
      }
      h = { type: 'jigsaw', tiles: tiles, t: 0 };
    } else if (k === 'sawmill') {
      h = { type: 'saw', x: w.leftX + 100, y: GY - 70, r: 62, dir: R() < 0.5 ? 1 : -1, sp: 300 + R() * 260, minX: w.leftX + 140, maxX: w.rightX - 140, t: 0 };
    } else if (k === 'updraft') {
      var cols = [];
      for (var ui = 0; ui < 3; ui++) cols.push({ x: 380 + ui * 420 + R() * 90, w: 110, top: GY - 460, bottom: GY });
      h = { type: 'updraft', cols: cols };
    }
    if (h) out.hazards.push(h);
  }
};

/* =========================================================
   渲染：手绘线条美学（毛笔飞白 / 墨点 / 速度线 / 网点）

'use strict';

/* ---------- 特效池 ---------- */
var FX = {
  parts: [], rings: [], lines: [], texts: [], decals: [],
  clear: function () { this.parts.length = 0; this.rings.length = 0; this.lines.length = 0; this.texts.length = 0; this.decals.length = 0; },
  ring: function (x, y, r, col, w) { this.rings.push({ x: x, y: y, r: r * 0.3, max: r, t: 0, dur: 0.35, col: col || '#23201c', w: w || 3 }); },
  spark: function (x, y, n, col) {
    for (var i = 0; i < n; i++) {
      var a = rand(0, TAU), s = rand(120, 520);
      this.parts.push({ x: x, y: y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 60, life: rand(0.15, 0.4), max: 0.4, col: col || '#ffd76a', sz: rand(1.5, 3.2), g: 1.2, t: 'line' });
    }
  },
  dust: function (x, y, dir) {
    for (var i = 0; i < 3; i++) this.parts.push({ x: x + rand(-6, 6), y: y + rand(-4, 4), vx: -dir * rand(30, 160), vy: -rand(20, 90), life: rand(0.3, 0.7), max: 0.7, col: '#8a7a60', sz: rand(2, 5), g: 0.2, t: 'dot' });
  },
  puff: function (x, y, col) { this.parts.push({ x: x, y: y, vx: rand(-40, 40), vy: rand(-60, -10), life: rand(0.3, 0.7), max: 0.7, col: col || '#8a7a60', sz: rand(3, 8), g: -0.1, t: 'dot' }); },
  flame: function (o, n, col) {
    var p = o.p ? o.p.chest : o;
    for (var i = 0; i < n; i++) this.parts.push({ x: p.x + rand(-8, 8), y: p.y + rand(-8, 8), vx: rand(-40, 40), vy: -rand(60, 180), life: rand(0.2, 0.5), max: 0.5, col: col || '#ff7a2f', sz: rand(3, 7), g: -0.3, t: 'flame' });
  },
  poof: function (x, y, col) {
    for (var i = 0; i < 10; i++) { var a = rand(0, TAU); this.parts.push({ x: x, y: y, vx: Math.cos(a) * rand(60, 260), vy: Math.sin(a) * rand(60, 260), life: rand(0.3, 0.6), max: 0.6, col: col || '#8a7a60', sz: rand(2, 6), g: 0.4, t: 'dot' }); }
  },
  bloodDot: function (x, y) { this.decals.push({ x: x, y: y, r: rand(1.5, 4), col: '#a8322d', t: 0 }); if (this.decals.length > 160) this.decals.shift(); },
  muzzle: function (x, y, a) {

  explode: function (x, y, r, col) {

    }

  },
  /* 终极演出：给"名字很大气"的武器用的全屏级演出 */

    this.texts.push({
      x: x + rand(-8, 8), y: y - 14, s: Math.round(dmg), t: 0, dur: 0.85,
      col: lv >= 3 ? '#a8322d' : (lv >= 2 ? '#8a2f28' : '#23201c'),
      sz: 12 + lv * 6 + p * 6, vy: -70 - lv * 14, bold: lv >= 2

      case 'pierce':

  },
  update: function (dt) {
    var i;
    for (i = this.parts.length - 1; i >= 0; i--) {
      var p = this.parts[i]; p.life -= dt;
      if (p.life <= 0) { this.parts.splice(i, 1); continue; }
      p.x += p.vx * dt; p.y += p.vy * dt; p.vy += PHYS.gravity * (p.g || 0) * dt * 0.35;
      p.vx *= 0.96; p.vy *= 0.96;

  g.translate(L * 0.35 - L * 0.5, -L * 0.25 - L * 0.25); g.rotate(0);

    } else if (h.type === 'cannon') {

      else if (h.phase === 'warn' && h.t <= 0) {

      } else if (tg.kind === 'springanvil') {

G.warnText = function (s) {

/* =========================================================
   布置物 / 抛射物 / 碎片

G.updEntities = function (dt) {
  var i, j;
  for (i = this.projs.length - 1; i >= 0; i--) {
    var p = this.projs[i];
    updateProj(p, dt, this);
    if (p.dead) this.projs.splice(i, 1);
  }
  for (i = this.deployables.length - 1; i >= 0; i--) {
    var d = this.deployables[i];
    d.life -= dt; if (d.armed > 0) d.armed -= dt;
    // 以前每帧 new Pt(...) 却从来没把 d.vx/d.vy 写进去 → 扔出去的陷阱其实原地不动，
    // 连重力都被 *0.5 抵消掉了。所以"扔向敌人"根本不会飞。
    d.vy += PHYS.gravity * dt;
    var tmp = new Pt(d.x, d.y, 1, d.r);
    tmp.px = d.x - d.vx * PHYS.sdt; tmp.py = d.y - d.vy * PHYS.sdt;
    this.world.collide(tmp);
    // 落地摩擦：只在接触地面时衰减，空中保持动量
    var groundish = Math.abs(tmp.vsy()) < 30;
    d.vx = tmp.vsx() * (groundish ? 0.72 : 0.995);
    d.vy = Math.min(tmp.vsy() * 0.995, 900);
    d.x = tmp.x; d.y = tmp.y;
    if (d.kind === 'mine' && d.armed <= 0) {
      for (j = 0; j < this.fighters.length; j++) {
        var f = this.fighters[j]; if (f.dead) continue;
        if (len2(f.center().x - d.x, f.center().y - d.y) < 74) {
          detonate({ x: d.x, y: d.y, kind: 'grenade', dmg: d.dmg, knock: d.knock, owner: d.owner, dead: false }, this);
          this.deployables.splice(i, 1); break;
        }
      }
    } else if (d.kind === 'spring') {
      // 原来每帧都对范围内所有人触发（还不移除），一个人站上去能刷出 2400 点伤害
      if (d.cool > 0) d.cool -= dt;
      for (j = 0; j < this.fighters.length; j++) {
        var f2 = this.fighters[j]; if (f2.dead) continue;
        if (Math.abs(f2.center().x - d.x) < 44 && Math.abs(f2.footY() - d.y) < 34 && !(d.cool > 0)) {
          d.cool = 0.9;
          var all = [f2.p.head, f2.p.chest, f2.p.pelvis, f2.p.footL, f2.p.footR, f2.p.kneeL, f2.p.kneeR];
          for (var z = 0; z < all.length; z++) all[z].addVel(0, -1250);
          // 弹飞之外补一点伤害：否则踩中只是被弹起来，实战等于 0 输出
          f2.applyHit({ dmg: 9, nx: 0, ny: -1, x: d.x, y: d.y, src: d.owner, kind: 'melee', power: 300, part: 'legL', pw: 6 });
          FX.ring(d.x, d.y, 40, '#b8860b'); SFX.tone(200, 900, 0.25, 'triangle', 0.16);
        }
      }
    } else if (d.kind === 'banana') {
      for (j = 0; j < this.fighters.length; j++) {
        var f3 = this.fighters[j]; if (f3.dead) continue;
        if (Math.abs(f3.footY() - d.y) < 34 && Math.abs(f3.center().x - d.x) < 46) {
          f3.applyHit({ dmg: 12, nx: sgn(f3.p.pelvis.vsx()) || 1, ny: -0.5, x: d.x, y: d.y, src: d.owner, kind: 'melee', power: 420, part: 'legL', pw: 6 });
          f3.addStatus('oil', 1.2); f3.instability = clamp(f3.instability + 0.35, 0, 1);
          f3.p.footL.addVel(rand(-300, 300), -200); f3.p.footR.addVel(rand(-300, 300), -200);
          this.deployables.splice(i, 1); FX.poof(d.x, d.y, '#b8860b');
        }
      }
    } else if (d.kind === 'firezone') {
      // 火焰区：站着就烧（会烧到所有人，包括扔的人）
      d.tick = (d.tick || 0) + dt;
      for (j = 0; j < this.fighters.length; j++) {
        var f5 = this.fighters[j]; if (f5.dead) continue;
        if (Math.abs(f5.center().x - d.x) < d.r && Math.abs(f5.footY() - d.y) < 42) {
          var ks5 = ['head', 'chest', 'pelvis', 'footL', 'footR', 'kneeL', 'kneeR', 'handL', 'handR'];
          for (var k5 = 0; k5 < ks5.length; k5++) f5.p[ks5[k5]].onFire = 1;
        }
      }
      if (d.tick > 0.1) {
        d.tick = 0;
        FX.parts.push({ x: d.x + rand(-d.r, d.r), y: d.y, vx: rand(-30, 30), vy: -rand(90, 200), life: rand(0.3, 0.7), max: 0.7, col: pick(['#ff7a2f', '#b8860b']), sz: rand(3, 7), g: -0.2, t: 'flame' });
      }
    } else if (d.kind === 'bear') {
      for (j = 0; j < this.fighters.length; j++) {
        var f4 = this.fighters[j]; if (f4.dead) continue;
        if (len2(f4.p.footL.x - d.x, f4.p.footL.y - d.y) < 38 || len2(f4.p.footR.x - d.x, f4.p.footR.y - d.y) < 38) {
          f4.applyHit({ dmg: d.dmg || 14, nx: 0, ny: 0, x: d.x, y: d.y, src: d.owner, kind: 'melee', power: 40, part: 'legL', pw: 20 });
          f4.addStatus('freeze', 1.6);
          this.deployables.splice(i, 1); FX.poof(d.x, d.y, '#4a4136');
        }
      }
    }
    if (d.life <= 0) this.deployables.splice(i, 1);
  }
  for (i = this.debris.length - 1; i >= 0; i--) {
    var b = this.debris[i];
    b.life -= dt; b.vy += PHYS.gravity * 0.8 * dt;
    b.x += b.vx * dt; b.y += b.vy * dt;
    var tb = new Pt(b.x, b.y, 1, b.r); this.world.collide(tb);
    b.vx = tb.vsx() * 0.4; b.vy = tb.vsy() * 0.4; b.x = tb.x; b.y = tb.y;
    if (b.life <= 0) this.debris.splice(i, 1);
  }
  // 传送门
  for (i = this.portals.length - 1; i >= 0; i--) {
    var pt = this.portals[i]; pt.t -= dt;
    if (pt.t <= 0) { this.portals.splice(i, 1); continue; }
    if (!pt.exit) {
      for (j = 0; j < this.fighters.length; j++) {
        var ff2 = this.fighters[j]; if (ff2.dead || ff2 === pt.owner) continue;
        if (len2(ff2.center().x - pt.x, ff2.center().y - pt.y) < 34 && this.portals.length > 1) {
          var ex = this.portals[1];
          var v = vsec(ff2.p.pelvis);
          var ox = ex.x - ff2.p.pelvis.x, oy = ex.y - ff2.p.pelvis.y;
          var ks = ['head', 'neck', 'chest', 'pelvis', 'elbL', 'handL', 'elbR', 'handR', 'kneeL', 'footL', 'kneeR', 'footR'];
          for (var kk = 0; kk < ks.length; kk++) { ff2.p[ks[kk]].x += ox; ff2.p[ks[kk]].y += oy; }
          FX.ring(ex.x, ex.y, 50, '#2f4b7c'); SFX.tone(900, 300, 0.3, 'sine', 0.14);
        }
      }
    }
  }
};

/* =========================================================
   对局流程
   ========================================================= */
G.after = function (t, fn) { this.timers.push({ t: t, fn: fn }); };
function GROUND_H_FOR(s2) { return s2.h; }
function GY_MINUS(v) { return (G.map && G.map.spawns && G.map.spawns[0]) ? G.map.spawns[0].y - v : 300; }
/* 0.4 秒体检一次：骨骼被清出物理世界就挂回去；卡在虚空里就拽回地面 */
G.healthCheck = function () {
  for (var i = 0; i < this.fighters.length; i++) {
    var f = this.fighters[i];
    if (!f.p || !f.p.pelvis) continue;
    var c = f.center();
    // 1) 数值炸了 / 飞出世界 → 拉回出生点
    if (!isFinite(c.x) || !isFinite(c.y) || Math.abs(c.x) > 1e6 || Math.abs(c.y) > 1e6) {
      var sp = this.map.spawns[0] || { x: 700, y: 410 };
      var dx0 = sp.x - c.x, dy0 = sp.y - c.y;
      for (var k in f.p) { f.p[k].x += dx0; f.p[k].y += dy0; f.p[k].px = f.p[k].x; f.p[k].py = f.p[k].y; }
      f.reattach();
      continue;
    }
    // 2) 骨骼不在物理世界 → 重新挂回（这就是"悬浮且打不动"的根因）
    if (this.world.parts.indexOf(f.p.pelvis) < 0 || this.world.parts.indexOf(f.p.chest) < 0) {
      f.reattach();
      FX.ring(c.x, c.y, 30, '#8a7a60');
      continue;
    }
    if (f.dead || f.isClone) continue;
    // 3) 卡在半空不动 → 拽回最近的地面
    var sp2 = Math.abs(f.p.pelvis.vsx()) + Math.abs(f.p.pelvis.vsy());
    if (sp2 < 12 && !f.grounded && !f.isDown()) {
      f.hoverT = (f.hoverT || 0) + 0.4;
      if (f.hoverT > 1.6) {
        f.hoverT = 0;
        var gy = this.world.groundBelowAt(f.p.pelvis.x, f.p.pelvis.y + 20);
        var dd = f.p.pelvis.y - gy;
        if (dd > 120 || dd < -20) {
          var shift = (gy - 60) - f.p.pelvis.y;
          for (var k2 in f.p) { f.p[k2].y += shift; f.p[k2].py = f.p[k2].y; }
          FX.dust(f.p.pelvis.x, gy, 0);
        } else {
          // 位置正常却不动：给一脚，别杵着
          f.p.chest.addF(0, 2200 * f.p.chest.m);
          f.p.pelvis.addF((Math.random() < 0.5 ? -1 : 1) * 900 * f.p.pelvis.m, 0);
        }
      }
    } else f.hoverT = 0;
  }
};
/* 主动结束当前对局 */

function readKeys(j) {

function bindJoy(el, j, who) {
  var knob = el.querySelector('.knob');
  // 每个摇杆记住"自己那根手指"，多点触控时互不干扰
  var pid = null, act = false;
  function radius() { return Math.round(el.getBoundingClientRect().width / 2 * 0.88) || 58; }
  var R = radius();
  function setKnob(dx, dy) { knob.style.transform = 'translate(' + dx + 'px,' + dy + 'px)'; }
  function rel(clientX, clientY) {
    var r = el.getBoundingClientRect();
    return { x: clientX - (r.left + r.width / 2), y: clientY - (r.top + r.height / 2) };
  }
  function upd(p) {
    R = radius();
    var l = len2(p.x, p.y), k = l > R ? R / l : 1;
    j.jx = clamp(p.x * k / R, -1, 1); j.jy = clamp(p.y * k / R, -1, 1);

    act = true; pid = id; SFX.init(); R = radius();

    setKnob(clamp(p.x, -R, R), clamp(p.y, -R, R)); upd(p);
  }
  function drag(clientX, clientY, id) {
    if (!act) return;
    if (id !== null && pid !== null && id !== pid) return;   // 不是我这根手指
    R = radius();
    var p = rel(clientX, clientY);
    setKnob(clamp(p.x, -R, R), clamp(p.y, -R, R)); upd(p);
  }
  function finish(id) {
    if (id !== null && pid !== null && id !== pid) return;

      e.preventDefault(); e.stopPropagation();

      e.preventDefault(); e.stopPropagation();
      drag(e.clientX, e.clientY, e.pointerId);
    }, { passive: false });
    el.addEventListener('pointerup', function (e) { e.stopPropagation(); finish(e.pointerId); });
    el.addEventListener('pointercancel', function (e) { finish(e.pointerId); });
    el.addEventListener('lostpointercapture', function (e) { finish(e.pointerId); });

  }
  el.addEventListener('touchstart', function (e) {
    e.preventDefault(); e.stopPropagation();
    var t = e.changedTouches[0];

  }, { passive: false });
  el.addEventListener('touchmove', function (e) {
    if (!act) return;
    e.preventDefault(); e.stopPropagation();
    var t = tOf(e, pid); if (!t) return;

    var t = tOf(e, pid); finish(t ? t.identifier : null);

    e.preventDefault(); e.stopPropagation();

  // 双击摇杆 = 冲刺

  if (IN.y < -0.55 && !IN.jumpHeld) { IN.jumpHeld = true; me.input.jump = true; }
  if (IN.y > -0.3) IN.jumpHeld = false;

  var me2 = G.player2;
  if (G.mode === 'duo' && me2 && !me2.dead) {
    me2.input.x = IN2.x; me2.input.y = IN2.y;
    flickCheck(IN2, 2);
    if (IN2.y < -0.55 && !IN2.jumpHeld) { IN2.jumpHeld = true; me2.input.jump = true; }
    if (IN2.y > -0.3) IN2.jumpHeld = false;

}
function flickCheck(j, who) {
  var ax = Math.abs(j.x), ay = Math.abs(j.y);
  if ((ax > 0.72 || ay > 0.72) && Math.abs(j.lastX) < 0.35) {
    var dir = ax >= ay ? sgn(j.x) : sgn(j.y) * 2;
    if (dir === j.lastFlickDir && G.time - j.flickT < 0.34) { doDash(who); j.lastFlickDir = 0; }
    else { j.lastFlickDir = dir; j.flickT = G.time; }
  }
  j.lastX = j.x;
}

  $('modeTip').innerHTML = '<b>单人对决</b>：你 vs 人机<br>'
    + '<b>本地双人</b>：同一块屏幕 1v1，左下摇杆=蓝方，右下摇杆=红方<br>'
    + '<b>大战场</b>：几十人同场混战，按队伍分敌我';
}
function gotoLoadout() {
  G.wepWho = 1; G.state = 'loadout'; show('sLoad'); syncLoadout();
}
function pickW(i, w) {
  if (G.wepWho === 2) G.wepIdx2 = i; else G.wepIdx = i;
  save();
  updWInfo(i); updMenuWep(); markSel($('wgrid'), i);
  $('bNext1').textContent = (G.mode === 'duo' && G.wepWho === 1) ? '下一位 P2 →' : '确 定 · ' + w.n;
  G.toast('已选：' + w.n);
}
function updWInfo(i) {
  var w = WEAPONS[i];
  $('wName').textContent = '✔ ' + w.n + '（' + w.c + '）';
  $('bNext1').textContent = (G.mode === 'duo' && G.wepWho === 1) ? '下一位 P2 →' : '确 定 · ' + w.n;
  $('wDesc').innerHTML = w.d + '<br><span class="mini">质量 ' + w.mass + ' · 冷却 ' + (w.cd || 0).toFixed(2) + 's' + (w.reach ? ' · 触及 ' + w.reach : '') + (w.dmg ? ' · 基础伤害 ' + w.dmg : '') + '</span>';
}
function randomSkin(s) {
  for (var key in SKIN_OPT) {
    var o = SKIN_OPT[key];
    if (o.t === 'sw') s[key] = pick(o.list);
    else if (o.t === 'ch') s[key] = pick(o.list);
    else s[key] = rand(o.min, o.max);
  }
  s.hair = pick(SKIN_OPT.hair.list); s.eye = pick(SKIN_OPT.eye.list);
  s.head = pick(SKIN_OPT.head.list); s.hand = pick(SKIN_OPT.hand.list); s.foot = pick(SKIN_OPT.foot.list);
  s.tattoo = pick(SKIN_OPT.tattoo.list); s.aura = pick(SKIN_OPT.aura.list); s.tip = pick(SKIN_OPT.tip.list);
  s.lw = rand(3.5, 7.5);
  save();
}
function startRound() {
  show(null);
  $('hud').style.display = 'block';
  G.paused = false;
  G.newRound();
  resize();
}

/* =========================================================
   启动
   ========================================================= */
function boot() {
  resize(); load(); applyCfg(); bindUI();
  G.world = new World();
  G.map = { name: '', verb: '', hazards: [], spawns: [{ x: 400, y: 480 }, { x: 1200, y: 480 }], bg: { hue: 0, far: 0.5 } };
  show('sMenu');
  requestAnimationFrame(drawPreview);
  requestAnimationFrame(frame);
}
var _origFrame = frame;
frame = function (ts) { updInput(1 / 60); _origFrame(ts); };
boot();

</script>
